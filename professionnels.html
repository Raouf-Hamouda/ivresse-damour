        <div class="faits__l"><dt class="faits__k" data-fr="Conditions" data-es="Condiciones" data-en="Terms"></dt>

<script>siteChrome.init();</script>
<script>
/* Meme regle qu au contact : le bouton s allume quand les champs obligatoires
   sont remplis, et l envoi dit la verite au lieu de faire semblant. */
(function(){
  var f = document.getElementById('f-pro');
  if(!f) return;
  var b = document.getElementById('envoyer');
  var r = document.getElementById('reponse');
  var champs = ['societe','contact','courriel','ville','message'].map(function(i){ return document.getElementById(i); });

  function adresseValide(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); }
  function complet(){
    for(var i=0;i<champs.length;i++){ if(!champs[i] || !champs[i].value.trim()) return false; }
    return adresseValide(document.getElementById('courriel').value);
  }
  function maj(){
    var ok = complet();
    b.disabled = !ok;
    b.classList.toggle('est-inactif', !ok);
  }
  for(var i=0;i<champs.length;i++){ if(champs[i]) champs[i].addEventListener('input', maj); }
  maj();

  f.addEventListener('submit', function(e){
    e.preventDefault();
    if(!complet()) return;
    r.hidden = false;
  });
})();
</script>
