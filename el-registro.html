<html lang="fr">

<!-- ============================================================================
     EL REGISTRO, page 5 de la structure envoyee au client le 3 aout 2026.
     La page la plus importante du site : "le site est le registre de la maison".
     Mise en page : la boite editoriale du GABARIT, comme el-palenque.html.
     Aucune scene pleine page, aucun prix, aucun panier, aucun bouton d achat.

     CE QUE CETTE PAGE FAIT
       1. l entree par le numero de bouteille, deux nombres, sans rechargement
       2. la fiche d un lot, tout ce que porte l etiquette
       3. les crus : l espadin chaque annee, le tobala et le coyote quand la
          plante decide, et une annee sans lot est DITE
       4. l archive : un lot epuise reste affiche, epuise et date, jamais solde

     LA CORRECTION DE L APPEL, lignes 855 a 866 du 27 juillet 2026 :
       "ce ne sera pas grave, ce sera note. Imprime. Ca va etre fait a la main."
     Le numero n est donc PAS grave. Il est ecrit a la main sur l etiquette
     imprimee. La structure du 3 aout dit "grave", elle a tort, l appel corrige.

     LES DONNEES
     Tout ce qui s affiche ici vient de assets/data/lots.json. La page ne porte
     aucune donnee de lot en dur, sauf la copie de secours en bas de ce fichier,
     qui ne sert qu au double clic. Le mode d emploi de la famille est dans
     PUBLIER_UN_LOT.md.

     LES LOTS AFFICHES SONT DES EXEMPLES. Ils portent exemple: true dans le
     fichier, la page les marque un par un, et le dit en tete de l archive.
     Aucun d eux n est une bouteille reelle de la maison.
     ========================================================================= -->

<body data-page="registro"
      data-titre-fr="El Registro. Ivresse d'Amour, Toloache Legitimo"
      data-titre-es="El Registro. Ivresse d'Amour, Toloache Legitimo"
      data-titre-en="El Registro. Ivresse d'Amour, Toloache Legitimo">

<main class="page">

  <!-- ===================================================================
       1. ENTETE DE PAGE.
       =================================================================== -->
  <section class="entete-page">
    <div class="boite">
      <p class="kicker" data-fr="Le registre" data-es="El registro" data-en="The register"></p>
      <h1 data-fr="El Registro" data-es="El Registro" data-en="El Registro"></h1>
      <p class="chapo"
         data-fr="Chaque lot a sa page. Le visiteur entre par le numéro écrit à la main sur sa bouteille et trouve l'histoire exacte de ce qu'il tient. L'archive ne se vide jamais."
         data-es="Cada lote tiene su página. El visitante entra por el número escrito a mano en su botella y encuentra la historia exacta de lo que tiene. El archivo nunca se vacía."
         data-en="Every lot has its page. The visitor enters by the number written by hand on the bottle and finds the exact history of what is in their hands. The archive never empties."></p>
    </div>
  </section>

  <!-- ===================================================================
       2. L ENTREE. Deux nombres, ceux qui sont ecrits a la main sur
       l etiquette. La fiche s ouvre en place, la page ne se recharge pas.
       Un numero inconnu recoit une phrase, jamais une erreur rouge.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <div class="avec-cote">
        <div class="avec-cote__cote">
          <p class="kicker" data-fr="L'entrée" data-es="La entrada" data-en="The way in"></p>
          <!-- Le ticket de la maison. Il est large et plat : a 104 px de boite
               il ne fait plus que 50 px de haut et la gravure se perd. On lui
               donne la boite de 150, la plus grande que le contrat autorise. -->
          <span class="embleme embleme--l" data-embleme="registro"></span>
        </div>
        <div class="colonne">
          <h2 data-fr="Le numéro de votre bouteille"
              data-es="El número de su botella"
              data-en="The number on your bottle"></h2>
          <p data-fr="Le numéro n'est pas gravé. Il est écrit à la main sur l'étiquette imprimée, bouteille par bouteille. Deux nombres : celui de votre bouteille, puis le tirage du lot."
             data-es="El número no está grabado. Está escrito a mano en la etiqueta impresa, botella por botella. Dos números: el de su botella, y luego el tiraje del lote."
             data-en="The number is not engraved. It is written by hand on the printed label, bottle by bottle. Two numbers: your bottle, then the size of the lot."></p>

          <form id="reg-form" novalidate autocomplete="off">
            <div class="colonnes-2">
              <p>
                <label class="kicker" for="reg-numero" style="display:block"
                       data-fr="N°" data-es="N°" data-en="No."></label>
                <input id="reg-numero" name="numero" type="text" inputmode="numeric"
                       placeholder="___" autocomplete="off" style="max-width:210px"
                       data-fr-aria-label="Le numéro de votre bouteille"
                       data-es-aria-label="El número de su botella"
                       data-en-aria-label="The number on your bottle">
              </p>
              <p>
                <label class="kicker" for="reg-total" style="display:block"
                       data-fr="Sur" data-es="De" data-en="Of"></label>
                <input id="reg-total" name="total" type="text" inputmode="numeric"
                       placeholder="___" autocomplete="off" style="max-width:210px"
                       data-fr-aria-label="Le tirage du lot"
                       data-es-aria-label="El tiraje del lote"
                       data-en-aria-label="The size of the lot">
              </p>
            </div>
            <p style="margin-top:24px">
              <button class="b-vide" type="submit" style="max-width:300px"
                      data-fr="Ouvrir la fiche" data-es="Abrir la ficha" data-en="Open the sheet"></button>
            </p>
          </form>

          <!-- La reponse a la recherche. Jamais de rouge, jamais le mot erreur :
               une phrase, dans la voix de la maison. -->
          <div id="reg-reponse" role="status" aria-live="polite" style="margin-top:24px"></div>

          <p style="margin-top:24px"
             data-fr="Sans bouteille sous la main, l'archive plus bas ouvre n'importe quel lot."
             data-es="Sin botella a mano, el archivo de más abajo abre cualquier lote."
             data-en="With no bottle at hand, the archive below opens any lot."></p>

          <div id="reg-source" style="margin-top:24px"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================================================================
       3. LA FICHE DE LOT. Vide tant qu on n a pas demande un lot.
       Ecrite par registre.js, dans les trois langues, depuis lots.json.
       =================================================================== -->
  <section class="section section--filet" id="reg-fiche" hidden>
    <div class="boite">
      <p class="kicker" data-fr="La fiche de lot" data-es="La ficha de lote" data-en="The lot sheet"></p>
      <div id="reg-fiche-corps"></div>
      <p data-fr="Ce que porte l'étiquette, en entier. Le registre n'affiche pas de prix."
         data-es="Lo que lleva la etiqueta, completo. El registro no muestra precios."
         data-en="What the label carries, in full. The register shows no price."></p>
    </div>
  </section>

  <!-- ===================================================================
       4. LEUR PHRASE. Une seule, vingt six signes de mesure.
       Dite par la maison le 27 juillet, lignes 868 a 875.
       =================================================================== -->
  <section class="bloc-phrase fondu">
    <p data-fr="L'archive ne se vide jamais, elle s'allonge."
       data-es="El archivo nunca se vacía, se alarga."
       data-en="The archive never empties, it lengthens."></p>
  </section>

  <!-- ===================================================================
       5. LES CRUS. L espadin chaque annee. Le tobala et le coyote quand la
       plante decide. Une annee sans lot est DITE, jamais remplacee.
       Le contenu de la table vient de lots.json.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Les crus" data-es="Los crus" data-en="The crus"></p>
      <div class="colonne">
        <h2 data-fr="Ce que la plante donne" data-es="Lo que da la planta" data-en="What the plant gives"></h2>
        <p data-fr="L'espadín donne chaque année. Le tobalá et le coyote donnent quand la plante décide. S'il n'y a pas de tobalá cette année, le registre le dit. Un cru absent n'est jamais remplacé par un autre."
           data-es="El espadín da cada año. El tobalá y el coyote dan cuando la planta decide. Si no hay tobalá este año, el registro lo dice. Un cru ausente nunca se reemplaza por otro."
           data-en="Espadín gives every year. Tobalá and coyote give when the plant decides. If there is no tobalá this year, the register says so. An absent cru is never replaced by another."></p>
      </div>
      <div id="reg-crus" class="fondu"></div>
    </div>
  </section>

  <!-- ===================================================================
       6. L ARCHIVE. Un lot epuise reste affiche, epuise et date.
       Jamais solde, le prix monte avec le temps et jamais l inverse.
       Cette page ne porte aucun prix : la regle est dite, le chiffre non.
       Une seule section sur un autre papier dans la page, c est celle ci.
       =================================================================== -->
  <section class="section section--creme">
    <div class="boite">
      <p class="kicker" data-fr="L'archive" data-es="El archivo" data-en="The archive"></p>
      <div class="colonne">
        <h2 data-fr="Les lots passés restent" data-es="Los lotes pasados quedan" data-en="Past lots remain"></h2>
        <p data-fr="Un lot épuisé ne disparaît pas du registre : il reste affiché, épuisé et daté. Il n'est jamais soldé. "
           data-es="Un lote agotado no desaparece del registro: queda visible, agotado y fechado. Nunca se rebaja. "
           data-en="A sold out lot does not vanish from the register: it stays, sold out and dated. It is never discounted. "></p>
        <p data-fr="Chaque lot ouvert par la maison a sa page ici, du premier au dernier, avec sa parcelle, son année, son maestro et ses litres."
           data-es="Cada lote abierto por la casa tiene aquí su página, del primero al último, con su parcela, su año, su maestro y sus litros."
           data-en="Every lot the house opens has its page here, from the first to the last, with its plot, its year, its maestro and its litres."></p>
      </div>
      <div id="reg-archive" class="fondu"></div>
    </div>
  </section>

  <!-- ===================================================================
       7. LA SORTIE. La maison n a pas de bouton.
       =================================================================== -->
  <section class="section section--serre section--filet">
    <div class="boite centre">
      <a class="lien-discret" href="el-palenque.html"
         data-fr="Comment il est fait" data-es="Cómo se hace" data-en="How it is made"></a>
    </div>
  </section>

</main>

<!-- ============================================================================

     lire assets/data/lots.json, chaque fichier local etant sa propre origine.
     La page lit alors ce bloc, et elle le dit a l ecran.

     En ligne (http:// ou https://), ce bloc n est jamais lu : c est
     assets/data/lots.json qui gagne, toujours.

     Donc : la famille edite assets/data/lots.json. Si elle veut aussi verifier
