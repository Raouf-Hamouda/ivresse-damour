<main class="page">

  <section class="entete-page">
    <div class="boite">

      <h1 data-fr="La Historia" data-es="La Historia" data-en="La Historia"></h1>
      <p class="chapo"
         data-fr="Comment une maison de mezcal est née d'un coup de foudre. Villa Sola de Vega, un couple, un restaurant à Paris, et une légende que le Mexique se raconte encore."
         data-es="Cómo nació una casa de mezcal de un flechazo. Villa Sola de Vega, una pareja, un restaurante en París, y una leyenda que México sigue contándose."
         data-en="How a mezcal house was born of love at first sight. Villa Sola de Vega, a couple, a restaurant in Paris, and a legend Mexico still tells itself."></p>
    </div>
  </section>

  <section class="bloc-phrase fondu">
    <p data-fr="En français, tomber amoureux se dit : un coup de foudre."
       data-es="En francés, enamorarse se dice: un coup de foudre, un golpe de rayo."
       data-en="In French, falling in love is called un coup de foudre: a lightning strike."></p>
  </section>

  <section class="section section--filet">
    <div class="boite">
      <div class="avec-cote">
        <div class="avec-cote__cote">
          <p class="kicker" data-fr="Le village" data-es="El pueblo" data-en="The village"></p>
          <span class="embleme embleme--m" data-embleme="palenque"></span>
        </div>
        <div class="colonne fondu">
          <h2 data-fr="Villa Sola de Vega, Sierra Madre del Sur" data-es="Villa Sola de Vega, Sierra Madre del Sur" data-en="Villa Sola de Vega, Sierra Madre del Sur"></h2>
          <p data-fr="La maison vient d'un village de l'État d'Oaxaca, dans la Sierra Madre del Sur, au bord du río Sola. À l'entrée du village, l'arche dit : tierra del mezcal tobalá. C'est là que la famille a ses agaves, son palenque et son maestro mezcalero, Gilberto Vásquez."
             data-es="La casa viene de un pueblo del estado de Oaxaca, en la Sierra Madre del Sur, a orillas del río Sola. En la entrada del pueblo, el arco dice: tierra del mezcal tobalá. Ahí tiene la familia sus agaves, su palenque y su maestro mezcalero, Gilberto Vásquez."
             data-en="The house comes from a village in the state of Oaxaca, in the Sierra Madre del Sur, on the banks of the río Sola. At the village entrance the arch reads: tierra del mezcal tobalá. That is where the family has its agaves, its palenque and its maestro mezcalero, Gilberto Vásquez."></p>
          <p data-fr="Espadín chaque année, tobalá et coyote quand la plante le permet : la maison fait la semence, la récolte, le four de terre, la fermentation et la distillation. Rien n'est acheté fini."
             data-es="Espadín cada año, tobalá y coyote cuando la planta lo permite: la casa hace la siembra, la cosecha, el horno de tierra, la fermentación y la destilación. Nada se compra hecho."
             data-en="Espadín every year, tobalá and coyote when the plant allows: the house does the sowing, the harvest, the earth oven, the fermentation and the distillation. Nothing is bought finished."></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section section--filet">
    <div class="boite">
      <div class="avec-cote">
        <div class="avec-cote__cote">
          <p class="kicker" data-fr="Le coup de foudre" data-es="El flechazo" data-en="The lightning strike"></p>
          <span class="embleme embleme--m" data-embleme="mito"></span>
        </div>
        <div class="colonne fondu">
          <h2 data-fr="Une légende, un couple, un nom" data-es="Una leyenda, una pareja, un nombre" data-en="A legend, a couple, a name"></h2>
          <p data-fr="Au Mexique, on raconte qu'un jour la foudre a frappé un agave, l'a cuit dans la terre, et que le premier mezcal en est sorti : l'élixir des dieux, dit-on. La maison recueille cette histoire en gardienne, elle ne la possède pas. Elle est racontée une fois, entière, dans El Mito."
             data-es="En México se cuenta que un día el rayo golpeó un agave, lo coció en la tierra, y de ahí salió el primer mezcal: el elixir de los dioses, dicen. La casa recoge esa historia como guardiana, no la posee. Se cuenta una vez, entera, en El Mito."
             data-en="In Mexico they tell that one day lightning struck an agave, cooked it in the earth, and the first mezcal came out of it: the elixir of the gods, they say. The house keeps this story as its guardian, it does not own it. It is told once, whole, in El Mito."></p>
          <p data-fr="La maison appartient à un couple. En français, tomber amoureux se dit un coup de foudre : le même éclair. Celui qui frappe l'agave et donne le mezcal, celui qui frappe deux personnes et donne une vie. De là le nom, Ivresse d'Amour, et l'idée de la maison : faire la boisson de l'amour, sérieusement, à partir d'un village, d'une plante et d'une main."
             data-es="La casa pertenece a una pareja. En francés, enamorarse se dice un coup de foudre: el mismo rayo. El que golpea el agave y da el mezcal, el que golpea a dos personas y da una vida. De ahí el nombre, Ivresse d'Amour, y la idea de la casa: hacer la bebida del amor, en serio, a partir de un pueblo, una planta y una mano."
             data-en="The house belongs to a couple. In French, falling in love is un coup de foudre: the same lightning. The one that strikes the agave and gives mezcal, the one that strikes two people and gives a life. Hence the name, Ivresse d'Amour, and the idea of the house: to make the drink of love, seriously, from a village, a plant and a hand."></p>
          <p data-fr="Toloache est l'autre nom, celui de la plante que le folklore mexicain donne aux philtres d'amour. Toloache Legítimo : le vrai. Le sceau porte les deux noms, deux mains autour d'une fleur d'agave, comme un milagro que l'on offre en remerciement."
             data-es="Toloache es el otro nombre, el de la planta que el folclore mexicano da a los filtros de amor. Toloache Legítimo: el verdadero. El sello lleva los dos nombres, dos manos alrededor de una flor de agave, como un milagro que se ofrece en agradecimiento."
             data-en="Toloache is the other name, that of the plant Mexican folklore gives to love potions. Toloache Legítimo: the true one. The seal carries both names, two hands around an agave flower, like a milagro offered in thanks."></p>
        </div>
      </div>
    </div>
  </section>

       data-en="La amistad que nace en el flujo del mezcal sobrevive a cualquier cosa."></p>

  <section class="section section--filet">
    <div class="boite">
      <div class="avec-cote">
        <div class="avec-cote__cote">
          <p class="kicker" data-fr="Paris" data-es="París" data-en="Paris"></p>
          <span class="embleme embleme--m" data-embleme="ritual"></span>
        </div>
        <div class="colonne fondu">
          <h2 data-fr="Le restaurant, la table où tout commence" data-es="El restaurante, la mesa donde todo empieza" data-en="The restaurant, the table where it all begins"></h2>
          <p data-fr="À Paris, la famille tient Toloache, un restaurant mexicain sur les flancs de la butte Montmartre, 49 rue de Clignancourt. C'est là que le mezcal se goûte, se sert et se vend d'abord ; c'est de là que partent les premières bouteilles."
             data-es="En París, la familia tiene Toloache, un restaurante mexicano en la ladera de Montmartre, 49 rue de Clignancourt. Ahí el mezcal se prueba, se sirve y se vende primero; de ahí salen las primeras botellas."
             data-en="In Paris the family runs Toloache, a Mexican restaurant on the slopes of Montmartre, 49 rue de Clignancourt. That is where the mezcal is tasted, served and sold first; the first bottles leave from there."></p>
          <p data-fr="Chaque bouteille porte son numéro écrit à la main. Le numéro ouvre une page du registre : la parcelle, l'année, le maestro, les litres. Ce que la maison affirme, elle le montre."
             data-es="Cada botella lleva su número escrito a mano. El número abre una página del registro: la parcela, el año, el maestro, los litros. Lo que la casa afirma, lo muestra."
             data-en="Each bottle carries its handwritten number. The number opens a page of the register: the plot, the year, the maestro, the litres. What the house claims, it shows."></p>
        </div>
      </div>
    </div>
