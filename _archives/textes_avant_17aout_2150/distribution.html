<!-- ============================================================================
     DISTRIBUTION. Une des quatre pages du pied de page, donc appelee depuis
     toutes les pages du site. Elle repond a une seule question : jusqu ou la
     maison a le droit d aller.

     Brief de la famille du 14 aout, point 7 : "Pour l alcool, il faut aussi
     determiner les pays dans lesquels la vente et l expedition seront
     autorisees", et point 8 : "la gestion des droits d accise lorsque cela est
     necessaire".

     RIEN N EST TRANCHE. Aucun pays n est declare ouvert ici, parce qu aucun ne
     l est : la societe est en creation et le permis d importation est en cours
     (appel du 27 juillet, lignes 1600 a 1632). La page pose les cases, nomme ce
     qui decide, et renvoie au conseil ce qui releve du conseil.
     ========================================================================= -->

<body data-page=""
      data-titre-fr="Distribution. Ivresse d'Amour, Toloache Legitimo"
      data-titre-es="Distribución. Ivresse d'Amour, Toloache Legitimo"
      data-titre-en="Distribution. Ivresse d'Amour, Toloache Legitimo">

<main class="page">

  <section class="entete-page">
    <div class="boite">
      <p class="kicker" data-fr="Jusqu'où la maison va" data-es="Hasta dónde llega la casa" data-en="How far the house goes"></p>
      <h1 data-fr="Distribution" data-es="Distribución" data-en="Distribution"></h1>
      <p class="chapo"
         data-fr="Les pays servis, les importateurs, et ce que l'alcool doit à chaque frontière. Une bouteille ne part que là où la loi du pays d'arrivée le permet."
         data-es="Los países servidos, los importadores, y lo que el alcohol debe en cada frontera. Una botella solo sale hacia donde la ley del país de llegada lo permite."
         data-en="The countries served, the importers, and what alcohol owes at each border. A bottle only travels where the law of the receiving country allows."></p>
    </div>
  </section>

  <!-- ===================================================================
       CE QUI DECIDE. Trois choses, dans l ordre.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Ce qui décide" data-es="Lo que decide" data-en="What decides"></p>
      <div class="colonne fondu">
        <h2 data-fr="Trois choses avant la bouteille" data-es="Tres cosas antes de la botella" data-en="Three things before the bottle"></h2>
        <p data-fr="Le pays d'arrivée d'abord : il dit si l'alcool peut entrer, à quel âge on peut le recevoir, et par quel canal. Puis les droits d'accise et la taxe sur la valeur ajoutée, qui se règlent selon la destination. Puis le transporteur, qui doit accepter l'alcool et savoir le remettre."
           data-es="Primero el país de llegada: dice si el alcohol puede entrar, a qué edad se puede recibir, y por qué canal. Luego los impuestos especiales y el impuesto sobre el valor añadido, que se liquidan según el destino. Luego el transportista, que debe aceptar el alcohol y saber entregarlo."
           data-en="The receiving country first: it says whether alcohol may enter, at what age it may be received, and through which channel. Then excise duty and value added tax, settled according to the destination. Then the carrier, who must accept alcohol and know how to hand it over."></p>
        <p data-fr="Tant que ces trois choses ne sont pas écrites pour un pays, ce pays n'est pas servi et il n'apparaît pas comme ouvert sur cette page."
           data-es="Mientras esas tres cosas no estén escritas para un país, ese país no se sirve y no aparece como abierto en esta página."
           data-en="Until those three things are written for a country, that country is not served and does not appear as open on this page."></p>
      </div>
    </div>
  </section>

  <!-- ===================================================================
       LES ZONES. La structure de la liste. Aucune n est ouverte a ce jour.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Les zones" data-es="Las zonas" data-en="The zones"></p>
      <h2 data-fr="Où la maison sert" data-es="Dónde sirve la casa" data-en="Where the house serves"></h2>
      <dl class="faits fondu">
        <div class="faits__l"><dt class="faits__k" data-fr="France" data-es="Francia" data-en="France"></dt>
          <dd class="faits__v" data-fr="Toloache, le restaurant de la famille, 49 rue de Clignancourt, Paris 18 : le lieu où la maison sert et vend à Paris. Autres adresses bientôt." data-es="Toloache, el restaurante de la familia, 49 rue de Clignancourt, París 18: donde la casa sirve y vende en París. Otras direcciones pronto." data-en="Toloache, the family restaurant, 49 rue de Clignancourt, Paris 18: where the house serves and sells in Paris. Other addresses soon."></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Union européenne" data-es="Unión Europea" data-en="European Union"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Liste de pays à venir" data-es="Lista de países por venir" data-en="List of countries to come"></span></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Hors Union européenne" data-es="Fuera de la Unión Europea" data-en="Outside the European Union"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Liste de pays à venir" data-es="Lista de países por venir" data-en="List of countries to come"></span></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Mexique" data-es="México" data-en="Mexico"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À confirmer" data-es="Por confirmar" data-en="To be confirmed"></span></dd></div><!-- Mexique : a confirmer par la maison -->
        <div class="faits__l"><dt class="faits__k" data-fr="Pays fermés" data-es="Países cerrados" data-en="Closed countries"></dt>
          <dd class="faits__v" data-fr="Tout pays qui interdit l'import ou la vente à distance d'alcool"
              data-es="Todo país que prohíba la importación o la venta a distancia de alcohol"
              data-en="Any country that forbids the import or the distance selling of alcohol"></dd></div>
      </dl>
    </div>
  </section>

  <!-- ===================================================================
       LES IMPORTATEURS. Un nom entre ici quand il a signe, pas avant.
       =================================================================== -->
  <section class="section section--creme">
    <div class="boite">
      <p class="kicker" data-fr="Les importateurs" data-es="Los importadores" data-en="The importers"></p>
      <h2 data-fr="Qui porte la bouteille" data-es="Quién lleva la botella" data-en="Who carries the bottle"></h2>
      <div class="colonne">
        <p data-fr="Chaque importateur entrera ici avec son nom, son pays et les bouteilles qu'il porte. Un importateur qui s'arrête reste affiché, avec la date, comme un lot épuisé reste au registre."
           data-es="Cada importador entrará aquí con su nombre, su país y las botellas que lleva. Un importador que se detiene sigue publicado, con la fecha, como un lote agotado sigue en el registro."
           data-en="Each importer will enter here with its name, its country and the bottles it carries. An importer who stops stays listed, with the date, just as a sold out lot stays in the register."></p>
      </div>
      <dl class="faits fondu">
        <div class="faits__l"><dt class="faits__k" data-fr="France" data-es="Francia" data-en="France"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À venir" data-es="Por venir" data-en="To come"></span></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Union européenne" data-es="Unión Europea" data-en="European Union"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À venir" data-es="Por venir" data-en="To come"></span></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Reste du monde" data-es="Resto del mundo" data-en="Rest of the world"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À venir" data-es="Por venir" data-en="To come"></span></dd></div>
      </dl>
    </div>
  </section>

  <!-- ===================================================================
       ACCISE ET TVA. On nomme, on ne chiffre pas, et on dit qui doit ecrire.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Accise et taxe" data-es="Impuestos" data-en="Excise and tax"></p>
      <h2 data-fr="Ce que l'alcool doit à la frontière" data-es="Lo que el alcohol debe en la frontera" data-en="What alcohol owes at the border"></h2>
      <div class="colonne">
        <p data-fr="Un spiritueux paie des droits d'accise, et les droits se paient dans le pays où la bouteille est consommée. La taxe sur la valeur ajoutée suit ses propres règles, taux par taux, pays par pays. Une facture numérotée accompagne chaque envoi."
           data-es="Un destilado paga impuestos especiales, y esos impuestos se pagan en el país donde se consume la botella. El impuesto sobre el valor añadido sigue sus propias reglas, tipo por tipo, país por país. Una factura numerada acompaña cada envío."
           data-en="A spirit pays excise duty, and the duty is paid in the country where the bottle is consumed. Value added tax follows its own rules, rate by rate, country by country. A numbered invoice goes with every shipment."></p>
        <!-- Les taux, les regimes et les documents d expedition doivent etre ecrits et valides par un conseil avant la premiere vente. -->
        <p data-fr="Les taux, les régimes et les documents d'expédition sont fixés pays par pays avant la première vente."
           data-es="Los tipos, los regímenes y los documentos de expedición se fijan país por país antes de la primera venta."
           data-en="The rates, the regimes and the shipping documents are set country by country before the first sale."></p>
      </div>
      <dl class="faits fondu">
        <div class="faits__l"><dt class="faits__k" data-fr="Droits d'accise" data-es="Impuestos especiales" data-en="Excise duty"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Selon le pays de livraison" data-es="Según el país de entrega" data-en="According to the delivery country"></span></dd></div><!-- regime a ecrire par un conseil -->
        <div class="faits__l"><dt class="faits__k" data-fr="TVA par pays" data-es="IVA por país" data-en="VAT by country"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Selon le pays de livraison" data-es="Según el país de entrega" data-en="According to the delivery country"></span></dd></div><!-- taux a ecrire par un conseil -->
        <div class="faits__l"><dt class="faits__k" data-fr="Facture" data-es="Factura" data-en="Invoice"></dt>
          <dd class="faits__v" data-fr="Numérotée, une par envoi"
              data-es="Numerada, una por envío"
              data-en="Numbered, one per shipment"></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Âge légal" data-es="Edad legal" data-en="Legal age"></dt>
          <dd class="faits__v" data-fr="Celui du pays d'arrivée, vérifié à l'entrée du site et à la remise"
              data-es="El del país de llegada, verificado a la entrada del sitio y en la entrega"
              data-en="That of the receiving country, checked at the door of the site and on delivery"></dd></div>
      </dl>
    </div>
  </section>

  <section class="section section--serre section--filet">
    <div class="boite centre">
      <a class="lien-discret" href="professionnels.html"
         data-fr="Devenir importateur, écrire à la maison" data-es="Ser importador, escribir a la casa" data-en="Become an importer, write to the house"></a>
    </div>
  </section>

</main>
