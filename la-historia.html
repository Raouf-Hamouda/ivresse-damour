       data-en="In French, falling in love is called un coup de foudre: a lightning strike."></p>

  <section class="section section--filet">
    <div class="boite">

        <div class="colonne fondu">
          <h2 data-fr="Le coup de foudre" data-es="El flechazo y el rayo" data-en="Lightning and love"></h2>
          <p data-fr="Ivresse d&#x27;Amour joue sur ce double sens : l&#x27;éclair qui a cuit le premier agave de la légende et, en français, l&#x27;amour qui frappe d&#x27;un coup." data-es="Ivresse d&#x27;Amour juega con ese doble sentido: el rayo que coció el primer agave de la leyenda y, en francés, el amor que golpea de repente." data-en="Ivresse d&#x27;Amour plays on this double meaning: the lightning bolt that cooked the first legendary agave and, in French, love that strikes all at once."></p>
          <p data-fr="Toloache Legítimo désigne la plante des philtres d&#x27;amour du folklore mexicain. Notre sceau réunit ces deux histoires : deux mains autour d&#x27;une fleur d&#x27;agave, peintes comme un ex-voto." data-es="Toloache Legítimo nombra la planta de los filtros de amor del folclore mexicano. Nuestro sello une ambas historias: dos manos alrededor de una flor de agave, pintadas como un exvoto." data-en="Toloache Legítimo names the love-potion plant of Mexican folklore. Our seal brings both stories together: two hands around an agave flower, painted like an ex-voto."></p>
        </div>
      </div>
    </div>
  </section>

        <div class="colonne fondu">
          <h2 data-fr="Villa Sola de Vega, Oaxaca" data-es="Villa Sola de Vega, Oaxaca" data-en="Villa Sola de Vega, Oaxaca"></h2>
          <p data-fr="Notre maison est née à Villa Sola de Vega, un bourg de la Sierra Madre del Sur. À l&#x27;entrée du village, l&#x27;arche annonce la couleur : tierra del mezcal tobalá, cuna de la chilena."
             data-es="Nuestra casa nació en Villa Sola de Vega, un pueblo de la Sierra Madre del Sur. A la entrada, el arco dice quiénes somos: tierra del mezcal tobalá, cuna de la chilena."
             data-en="Our house was born in Villa Sola de Vega, a town in the Sierra Madre del Sur. At the entrance, the archway sets the tone: tierra del mezcal tobalá, cuna de la chilena."></p>
          <p data-fr="Nous y travaillons trois agaves. L&#x27;espadín est récolté chaque année. Le tobalá et le coyote sont coupés plus rarement, seulement lorsque la plante sauvage arrive à pleine maturité sur les pentes."
             data-es="Aquí trabajamos tres agaves. El espadín se cosecha cada año. El tobalá y el coyote se cortan con menos frecuencia, solo cuando la planta silvestre alcanza su madurez en las laderas."
             data-en="Here we work with three agaves. Espadín is harvested every year. Tobalá and coyote are cut less often, only when the wild plant reaches full maturity on the slopes."></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 22 oct : textes du lieu venus de La Tierra, reecrits pour le recit par Argon -->
  <section class="section">
    <div class="boite">
      <div class="detail fondu">
        <div>
          <h3 class="inter" data-fr="Entre rivière et sommets" data-es="Entre el río y las cumbres" data-en="Between river and peaks"></h3>
          <p data-fr="Nos parcelles grimpent jusqu&#x27;à 2 000 mètres d&#x27;altitude dans la sierra. Plus bas, au palenque, l&#x27;eau qui sert à nos fermentations descend directement du río Sola."
             data-es="Nuestras parcelas suben hasta los 2 000 metros de altitud en la sierra. Más abajo, en el palenque, el agua de nuestras fermentaciones baja directamente del río Sola."
             data-en="Our plots climb to 2,000 meters in the sierra. Down at the palenque, the water used for our fermentations flows straight from the río Sola."></p>
          <p data-fr="C&#x27;est sur ces pentes de pierre que le tobalá pousse seul. Nous le laissons venir à son rythme, neuf ans avant la coupe."
             data-es="En estas laderas de piedra el tobalá crece solo. Lo dejamos venir a su ritmo, nueve años antes del corte."
             data-en="On these stony slopes the tobalá grows on its own. We let it come at its own pace, nine years before the cut."></p>
        </div>
        <div>
          <h3 class="inter" data-fr="Ce que la montagne donne" data-es="Lo que da la sierra" data-en="What the mountain gives"></h3>
          <p data-fr="Nos agaves poussent lentement dans la rocaille. Ils grandissent grâce au travail silencieux de la montagne : les chauves-souris qui pollinisent la nuit, le sol qui tient la pente et la pluie retenue par les arbres."
             data-es="Nuestros agaves crecen despacio entre las piedras. Se crían gracias al trabajo silencioso del monte: los murciélagos que polinizan de noche, el suelo que sostiene la ladera y la lluvia que guardan los árboles."
             data-en="Our agaves grow slowly among the stones. They thrive on the mountain&#x27;s quiet work: bats pollinating at night, soil holding the slope, and rain kept by the trees."></p>
          <p data-fr="Ailleurs, les plantations serrées, la coupe du bois et les vinasses versées aux rivières abîment les sols. Ici, nous laissons les pentes respirer et les plantes se ressemer."
             data-es="En otras partes, las plantaciones apretadas, la tala y las vinazas tiradas al río dañan el suelo. Aquí dejamos que las laderas respiren y que el monte vuelva a sembrar."
             data-en="Elsewhere, tight plantations, logging and vinasse dumped in rivers damage the soil. Here, we let the slopes breathe and the plants reseed."></p>
        </div>
        <div>
          <h3 class="inter" data-fr="De la graine au verre" data-es="De la semilla a la copa" data-en="From seed to glass"></h3>
          <p data-fr="Nous faisons tout sur place : la semence, la récolte, le four de terre, la fermentation et la distillation. Rien n&#x27;est acheté en route, rien n&#x27;est sous-traité hors du bourg."
             data-es="Hacemos todo en el lugar: la siembra, la cosecha, el horno de tierra, la fermentación y la destilación. Nada se compra hecho, nada sale del pueblo a mitad del camino."
             data-en="We do everything on site: sowing, harvesting, earth oven, fermentation and distillation. Nothing is bought along the way, nothing is outsourced outside the town."></p>
        </div>
      </div>
    </div>
  </section>

             data-es="Entre los soltecos, el mezcal acompaña las fiestas, las bodas y la música chilena. Alrededor de la mesa, el español aún convive con el zapoteco, el chatino y el mixteco."
