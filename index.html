/* 1er sept 00h10, Raouf : a chaque ouverture de l'accueil, l'une des trois

(function(){

    { id:'espadin', latin:'A. angustifolia', agave:'A. angustifolia, espadín',
      kicker:{fr:"La bouteille du village", es:"La botella del pueblo", en:"The village bottle"},

    { id:'tobala', latin:'A. potatorum', agave:'A. potatorum, tobalá',
      kicker:{fr:"Le cru des hauteurs", es:"El cru de las alturas", en:"The mountain cru"},
      nom:'Tobalá',
      desc:{fr:"L'agave des hauteurs, petit et rare, récolté quand la plante le décide. Villa Sola de Vega, Oaxaca.",
            es:"El agave de las alturas, pequeño y raro, cosechado cuando la planta lo decide. Villa Sola de Vega, Oaxaca.",
            en:"The mountain agave, small and rare, harvested when the plant decides. Villa Sola de Vega, Oaxaca."} },
    { id:'coyote', latin:'A. americana', agave:'A. americana, coyote',
      kicker:{fr:"Le cru aux grandes feuilles", es:"El cru de grandes hojas", en:"The open-leaf cru"},
      nom:'Coyote',
      desc:{fr:"L'agave aux grandes feuilles ouvertes, un cru qui ne se remplace pas. Villa Sola de Vega, Oaxaca.",
            es:"El agave de grandes hojas abiertas, un cru que no se reemplaza. Villa Sola de Vega, Oaxaca.",
            en:"The agave of great open leaves, a growth never replaced. Villa Sola de Vega, Oaxaca."} },
  ];
  var b = B[Math.floor(Math.random()*B.length)];
  var h = document.querySelector('.heros-vente'); if(!h) return;
  var img = h.querySelector('.heros-vente__objet img');
  var lien = h.querySelector('.heros-vente__objet a');
  var achat = h.querySelector('.heros-vente__acheter');

  var nom = h.querySelector('.scene__titre');
  var lat = h.querySelector('.scene__ligne');
  var desc = h.querySelector('.heros-vente__desc');
  var agave = document.getElementById('fait-agave');
  if(img){
    img.setAttribute('src','assets/img/bouteilles/'+b.id+'_1200.jpg');

  }
  if(lien) lien.setAttribute('href','acheter-'+b.id+'.html');

  var langs = ['fr','es','en'];
  if(kick) for(var i=0;i<3;i++) kick.setAttribute('data-'+langs[i], b.kicker[langs[i]]);
  if(desc) for(var j=0;j<3;j++) desc.setAttribute('data-'+langs[j], b.desc[langs[j]]);
  if(nom) nom.textContent = b.nom;
  if(lat) lat.textContent = b.latin;

  if(fn) for(var k=0;k<3;k++) fn.setAttribute('data-'+langs[k], b.nom);

<script>
/* 22 oct 2026. Les portes de l accueil s ouvrent comme sur nude.eu (clip par le bas, image 1.15 a 1, lignes hors masque).
   Entree dans El Ritual : choregraphie ecrite par Gemini 4 Argon le 22 oct (diagnostic dans scratchpad argon_transition) :
   pas de clone, la view transition native fait seule le morphing porte -> hero ; texte replie au clic ; prefetch + decode au survol ; bfcache nettoye. */
(function(){
  var portes = document.querySelectorAll('.scene--porte, .champ');
  if (!portes.length) return;

  var reduit = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var supportVT = ('CSS' in window && CSS.supports('view-transition-name: none') && 'onpageswap' in window);

  /* 1. Prefetch HTML + Preload image exacte au survol / touchstart */
  var lienRituel = document.querySelector('.scene--porte a[href="el-ritual.html"]');
  var sceneRituel = lienRituel ? lienRituel.closest('.scene--porte') : null;

  if (lienRituel && sceneRituel) {
    var prechargee = false;
    var precharger = function() {
      if (prechargee) return;
      prechargee = true;
      var l = document.createElement('link');
      l.rel = 'prefetch';
      l.href = lienRituel.href;
      document.head.appendChild(l);
      /* Force le décodage en cache mémoire de la source exacte */
      var img = sceneRituel.querySelector('img');
      if (img && img.currentSrc) {
        var preImg = new Image();
        preImg.src = img.currentSrc;
        if (preImg.decode) preImg.decode().catch(function(){});
      }
    };
    sceneRituel.addEventListener('pointerenter', precharger, {passive: true});
    sceneRituel.addEventListener('touchstart', precharger, {passive: true});
    lienRituel.addEventListener('focus', precharger, {passive: true});

    /* 2. Au clic : si View Transitions natif est supporté, ZERO clone, départ immédiat.
          Sinon (Firefox), fallback FLIP propre en GPU (transform/clip-path). */
    lienRituel.addEventListener('click', function(e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;

      /* Scénario A : Navigateur moderne (Chrome / Safari 18.2+).
         On laisse la navigation native partir à t=0ms. Le texte se replie pendant le court délai réseau. */
      if (supportVT && !reduit) {
        sceneRituel.classList.add('est-quittee');
        return;
      }

      /* Scénario B : Fallback sans View Transitions (Firefox) */
      if (reduit) return;
      e.preventDefault();
      if (document.querySelector('.porte-plein')) return;

      sceneRituel.classList.add('est-quittee');
      var img = sceneRituel.querySelector('.scene__fond--photo img');
      var r = img.getBoundingClientRect();
      var th = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tete-h')) || 0;
      var targetH = window.innerHeight - th;
      if (window.innerWidth <= 760) targetH = Math.min(targetH, window.innerWidth * 1.25);

      var box = document.createElement('div');
      box.className = 'porte-plein';
      box.style.top = th + 'px';
      box.style.height = targetH + 'px';

      var c = img.cloneNode(false);
      c.removeAttribute('loading');
      c.style.objectPosition = '71% 100%';
      box.appendChild(c);
      document.body.appendChild(box);

      /* Calcul du clip-path initial (invert) pour animer uniquement en GPU */
      var topClip = Math.max(0, r.top - th);
      var botClip = Math.max(0, (th + targetH) - r.bottom);
      var leftClip = Math.max(0, r.left);
      var rightClip = Math.max(0, window.innerWidth - r.right);

      box.style.clipPath = 'inset(' + topClip + 'px ' + rightClip + 'px ' + botClip + 'px ' + leftClip + 'px)';
      c.style.transform = 'scale(1.06)';
      box.getBoundingClientRect(); /* Force reflow */

      var D = 650, courbe = 'cubic-bezier(.16,1,.3,1)';
      box.style.transition = 'clip-path ' + D + 'ms ' + courbe;
      c.style.transition = 'transform ' + D + 'ms ' + courbe;
      box.style.clipPath = 'inset(0px 0px 0px 0px)';
      c.style.transform = 'scale(1)';

      setTimeout(function() { location.href = lienRituel.href; }, D - 30);
    });
  }

  /* 3. Nettoyage BFCache (Bouton Back du navigateur) */
  window.addEventListener('pageshow', function(e) {
    if (sceneRituel) sceneRituel.classList.remove('est-quittee');
    var restes = document.querySelectorAll('.porte-plein');
    for (var i = 0; i < restes.length; i++) restes[i].remove();
  });

  /* 4. Reveal au scroll des portes */
  function ouvrir(s) {
    var l = s.querySelectorAll('.ouverture__l');
    for (var i = 0; i < l.length; i++) l[i].style.transitionDelay = (i * 90) + 'ms';
    var img = s.querySelector('.scene__fond--photo img');
    var go = function() { s.classList.add('est-ouverte'); };
    if (img && !(img.complete && img.naturalWidth)) {
      var fin = false, f = function() { if (!fin) { fin = true; go(); } };
      if (img.decode) img.decode().then(f, f);
      img.addEventListener('load', f, {once: true});
      img.addEventListener('error', f, {once: true});
      setTimeout(f, 2500);
    } else if (img && img.decode) {
      img.decode().then(go, go);
    } else {
      go();
    }
  }

  if (reduit || !('IntersectionObserver' in window)) {
    for (var i = 0; i < portes.length; i++) portes[i].classList.add('est-ouverte');
    return;
  }
  var o = new IntersectionObserver(function(es) {
    es.forEach(function(e) {
      if (e.isIntersecting) { ouvrir(e.target); o.unobserve(e.target); }
    });
  }, {rootMargin: '0px 0px -15% 0px'});
  for (var j = 0; j < portes.length; j++) o.observe(portes[j]);
})();
</script>

<script>
/* 22 oct 2026. Le champ du jeu : trois rangs d'emblemes, deux montagnes, parallaxe, une penca qui tombe. */
(function(){
  var svg = document.querySelector('.champ__svg'); if(!svg || typeof window.embleme_espadin !== 'function') return;
  var NS = 'http://www.w3.org/2000/svg', W = 1600, HOR = 330;
  var reduit = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function el(n, a, parent){ var e = document.createElementNS(NS, n); for(var k in a) e.setAttribute(k, a[k]); (parent || svg).appendChild(e); return e; }
  /* symboles : un par agave, dessines par emblemes.js dans le disque -120..120 */
  var defs = el('defs', {});
  ['espadin','tobala','coyote'].forEach(function(c){
    var sym = el('symbol', { id:'champ-' + c, viewBox:'-120 -120 240 240' }, defs);
    sym.innerHTML = window['embleme_' + c]({ color:'currentColor' });
  });
  /* montagnes : deux lignes decoupees sur le ciel */
  function montagne(pts, fill, op, v){
    var d = 'M0 ' + HOR + ' '; pts.forEach(function(p){ d += 'L' + p[0] + ' ' + p[1] + ' '; }); d += 'L' + W + ' ' + HOR + ' Z';
    var g = el('g', { 'class':'champ__couche', 'data-v':v });
    el('path', { d:d, fill:fill, opacity:op }, g); return g;
  }
  montagne([[0,250],[140,215],[300,235],[430,180],[560,205],[700,170],[860,200],[990,160],[1130,195],[1270,165],[1410,205],[1520,185],[1600,215]], 'var(--papier-olive)', .55, .018);
  montagne([[0,300],[120,278],[250,292],[380,262],[520,288],[660,268],[800,290],[950,258],[1100,284],[1250,266],[1400,290],[1520,272],[1600,296]], 'var(--vert-agave)', .42, .030);
  var devant = [];
  /* parallaxe : chaque couche glisse d'une fraction de l'ecart au centre de l'ecran */
  var couches = svg.querySelectorAll('.champ__couche'), scene = svg.parentNode, tick = false;
  function poser(){
    tick = false;
    var r = scene.getBoundingClientRect(), d = (r.top + r.height / 2) - window.innerHeight / 2;
    for(var i = 0; i < couches.length; i++){ var v = parseFloat(couches[i].getAttribute('data-v')); couches[i].setAttribute('transform', 'translate(0 ' + (d * v).toFixed(1) + ')'); }
  }
  if(!reduit){ window.addEventListener('scroll', function(){ if(!tick){ tick = true; requestAnimationFrame(poser); } }, { passive:true }); window.addEventListener('resize', poser); poser(); }
})();
</script>

<script>
/* Le sceau de l accueil : l animation retenue le 16 aout, une fois, au chargement. */
(function(){
  var svg = document.getElementById('sceau-accueil');
  /* meme regle que site.js : sous 100 px le sceau se pose complet, le dessin
     de 3 s ne se lit qu'en grand */
  if(svg){
    var grand = svg.getBoundingClientRect().width >= 100;
    if(typeof window.sceauAnime === 'function' && grand){ window.sceauAnime(svg); }
    else if(typeof window.logoIvresse === 'function'){
      svg.innerHTML = window.logoIvresse({ x:443, y:290, scale:1, anime:false, color:'currentColor' });
    }
  }
  /* Les emblemes poses dans les scenes. */
  var els = document.querySelectorAll('[data-embleme]');
  for(var i=0;i<els.length;i++){
    var f = window['embleme_' + els[i].getAttribute('data-embleme')];
    if(typeof f === 'function'){
      els[i].innerHTML = '<svg viewBox="-120 -120 240 240" aria-hidden="true">' + f({color:'currentColor'}) + '</svg>';
    }
  }
  /* La grille des trois bouteilles, batie depuis siteChrome.bouteilles. */
  var g = document.getElementById('grille-bouteilles');
  if(g && window.siteChrome && siteChrome.bouteilles){
    g.innerHTML = siteChrome.bouteilles.map(function(b){
      var em = window['embleme_' + (b.embleme || 'botella')];
      var svg = typeof em === 'function'
        ? '<svg viewBox="-120 -120 240 240" aria-hidden="true">' + em({color:'currentColor'}) + '</svg>' : '';
      return '<a class="grille__c" href="' + b.href + '" style="--accent-c:' + b.accent + '">' +
               '<span class="grille__media">' + svg + '</span>' +
               '<span class="grille__pied">' +
                 '<span class="grille__nom" data-fr="' + b.fr + '" data-es="' + b.es + '" data-en="' + b.en + '"></span>' +
                 '<span class="grille__latin">' + b.latin + '</span>' +
                 '<span class="grille__etat" data-fr="Voir la bouteille" data-es="Ver la botella" data-en="See the bottle"></span>' +
               '</span></a>';
    }).join('');
    /* siteChrome.langue() ne fait que lire la langue : c est appliquerLangue qui ecrit les noms dans la grille. */
    siteChrome.appliquerLangue(siteChrome.langueCourante(), g);
  }
})();
</script>
