<script>
/* 1er sept 00h10, Raouf : a chaque ouverture de l'accueil, l'une des trois
   bouteilles se presente, au hasard ; le kicker, le nom, le latin, la ligne,
   l'agave de l'etiquette et le lien d'achat suivent. Pose avant init() pour
   que la langue s'applique sur la bouteille tiree. */
(function(){
  var B = [
    { id:'espadin', latin:'A. angustifolia', agave:'A. angustifolia, espadín',
      kicker:{fr:"La bouteille du village", es:"La botella del pueblo", en:"The village bottle"},
      nom:'Espadín',
      desc:{fr:"L'agave du village, cuit au four de terre par Gilberto Vásquez. Villa Sola de Vega, Oaxaca.",
            es:"El agave del pueblo, cocido en horno de tierra por Gilberto Vásquez. Villa Sola de Vega, Oaxaca.",
            en:"The village agave, cooked in an earth oven by Gilberto Vásquez. Villa Sola de Vega, Oaxaca."} },
    { id:'tobala', latin:'A. potatorum', agave:'A. potatorum, tobalá',
      kicker:{fr:"Le cru des hauteurs", es:"El cru de las alturas", en:"The mountain cru"},
      nom:'Tobalá',
      desc:{fr:"L'agave des hauteurs, petit et rare, récolté quand la plante le décide. Villa Sola de Vega, Oaxaca.",
            es:"El agave de las alturas, pequeño y raro, cosechado cuando la planta lo decide. Villa Sola de Vega, Oaxaca.",
            en:"The mountain agave, small and rare, harvested when the plant decides. Villa Sola de Vega, Oaxaca."} },
    { id:'coyote', latin:'A. americana', agave:'A. americana, coyote',
      kicker:{fr:"Le cru aux grandes feuilles", es:"El cru de grandes hojas", en:"The open-leaf cru"},
      nom:'Coyote',
      desc:{fr:"L'agave aux grandes feuilles ouvertes, un cru qui ne se remplace pas. Villa Sola de Vega, Oaxaca.",
            es:"El agave de grandes hojas abiertas, un cru que no se reemplaza. Villa Sola de Vega, Oaxaca.",
            en:"The agave of great open leaves, a growth never replaced. Villa Sola de Vega, Oaxaca."} },
  ];
  var b = B[Math.floor(Math.random()*B.length)];
  var h = document.querySelector('.heros-vente'); if(!h) return;
  var img = h.querySelector('.heros-vente__objet img');
  var lien = h.querySelector('.heros-vente__objet a');
  var achat = h.querySelector('.heros-vente__acheter');
  var kick = h.querySelector('.scene__kicker');
  var nom = h.querySelector('.scene__titre');
  var lat = h.querySelector('.scene__ligne');
  var desc = h.querySelector('.heros-vente__desc');
  var agave = document.getElementById('fait-agave');
  if(img){
    img.setAttribute('src','assets/img/bouteilles/'+b.id+'_1200.jpg');
    img.setAttribute('srcset','assets/img/bouteilles/'+b.id+'_600.jpg 600w, assets/img/bouteilles/'+b.id+'_1200.jpg 1200w, assets/img/bouteilles/'+b.id+'_2000.jpg 2000w');
  }
  if(lien) lien.setAttribute('href','acheter-'+b.id+'.html');
  if(achat) achat.setAttribute('href','acheter-'+b.id+'.html');
  var langs = ['fr','es','en'];
  if(kick) for(var i=0;i<3;i++) kick.setAttribute('data-'+langs[i], b.kicker[langs[i]]);
  if(desc) for(var j=0;j<3;j++) desc.setAttribute('data-'+langs[j], b.desc[langs[j]]);
  if(nom) nom.textContent = b.nom;
  if(lat) lat.textContent = b.latin;
  if(agave) agave.textContent = b.agave;
})();
</script>
<script>siteChrome.init();</script>
<script>
/* Le sceau de l accueil : l animation retenue le 16 aout, une fois, au chargement. */
(function(){
  var svg = document.getElementById('sceau-accueil');
  /* meme regle que site.js : sous 100 px le sceau se pose complet, le dessin
     de 3 s ne se lit qu'en grand */
  if(svg){
    var grand = svg.getBoundingClientRect().width >= 100;
    if(typeof window.sceauAnime === 'function' && grand){ window.sceauAnime(svg); }
    else if(typeof window.logoIvresse === 'function'){
      svg.innerHTML = window.logoIvresse({ x:443, y:290, scale:1, anime:false, color:'currentColor' });
    }
  }
  /* Les emblemes poses dans les scenes. */
  var els = document.querySelectorAll('[data-embleme]');
  for(var i=0;i<els.length;i++){
    var f = window['embleme_' + els[i].getAttribute('data-embleme')];
    if(typeof f === 'function'){
      els[i].innerHTML = '<svg viewBox="-120 -120 240 240" aria-hidden="true">' + f({color:'currentColor'}) + '</svg>';
    }
  }
  /* La grille des trois bouteilles, batie depuis siteChrome.bouteilles. */
  var g = document.getElementById('grille-bouteilles');
  if(g && window.siteChrome && siteChrome.bouteilles){
    g.innerHTML = siteChrome.bouteilles.map(function(b){
      var em = window['embleme_' + (b.embleme || 'botella')];
      var svg = typeof em === 'function'
        ? '<svg viewBox="-120 -120 240 240" aria-hidden="true">' + em({color:'currentColor'}) + '</svg>' : '';
      return '<a class="grille__c" href="' + b.href + '" style="--accent-c:' + b.accent + '">' +
               '<span class="grille__media">' + svg + '</span>' +
               '<span class="grille__pied">' +
                 '<span class="grille__nom" data-fr="' + b.fr + '" data-es="' + b.es + '" data-en="' + b.en + '"></span>' +
                 '<span class="grille__latin">' + b.latin + '</span>' +
                 '<span class="grille__etat" data-fr="Voir la bouteille" data-es="Ver la botella" data-en="See the bottle"></span>' +
               '</span></a>';
    }).join('');
    /* siteChrome.langue() ne fait que lire la langue : c est appliquerLangue qui ecrit les noms dans la grille. */
    siteChrome.appliquerLangue(siteChrome.langueCourante(), g);
  }
})();
</script>
<!-- 1er sept 01h, Raouf : "je ne veux pas que la plante se deplace en

     gyroscope pilote desormais la MEME caresse que la souris (site.js) :
