<script>
siteChrome.init();

/* LE COMPTE DU SAC, AU CHARGEMENT. Meme geste que dans la boutique : ajouter
   zero remet le compte de l entete a jour. */
(function(){
  var c = window.siteChrome;
  if(c && c.panier && c.bouteilles && c.bouteilles.length){
    c.panier.ajouter(c.bouteilles[0].id, 0);
  }
})();

/* LE PANIER. Celui de site.js, on n en ecrit pas un second. La quantite
   choisie s ajoute d un coup. */
(function(){
  var panier = window.siteChrome && window.siteChrome.panier;
  if(!panier) return;
  function etat(){
    var p = panier.lire();
    var els = document.querySelectorAll('[data-etat]');
    for(var i=0;i<els.length;i++){
      var id = els[i].getAttribute('data-etat');
      var n = p[id] | 0;
      els[i].hidden = n < 1;
      var c = els[i].querySelector('[data-nombre="' + id + '"]');
      if(c) c.textContent = String(n);
    }
  }
  var b = document.querySelectorAll('[data-ajouter]');
  for(var i=0;i<b.length;i++){
    b[i].addEventListener('click', function(){
      var id = this.getAttribute('data-ajouter');
      var s = document.querySelector('[data-qte="' + id + '"]');
      var q = s ? (parseInt(s.value, 10) || 1) : 1;
      panier.ajouter(id, q);
      etat();
    });
  }
  etat();
})();
</script>
