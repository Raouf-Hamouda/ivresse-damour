<!-- ============================================================================

     Mise en page : la boite editoriale du GABARIT, pas les scenes pleine page.
     Decision de Raouf du 16 aout : le chrome reste celui de l entete unique,
     les pages de lecture reviennent a la boite, parce que c est ainsi qu une
     maison d alcool se lit.

     AUCUNE PHOTOGRAPHIE N EXISTE. Chaque bloc image est une plaque vide, un
     aplat de papier calme marque en diagonale, avec sa legende exacte et la
     mention que la photographie du Mexique est attendue. Aucun paysage n est
     dessine ici et aucun agave n est improvise dans le code : le cahier du
     dossier dit que les planches d agave se dessinent d apres les photos de la
     famille, sinon tout tombe en clipart.

     LES FAITS. Villa Sola de Vega, Oaxaca. Sierra Madre del Sur, jusqu a
     2 000 m. Les eaux du rio Sola. Maestro mezcalero Gilberto Vasquez. Mezcal
     Artesanal, joven, D.O. protegee. Espadin A. angustifolia, 50 %, 700 ml.
     Double distillation, alambic de cuivre. Four de terre. Tout le reste est
     marque attendu de la maison avec la classe .mention.
     L eclair appartient a El Mito. Cette page est le four et l alambic.
     ========================================================================= -->
