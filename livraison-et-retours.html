<!-- ============================================================================
     LIVRAISON ET RETOURS. Brief de la famille du 14 aout, point 7 : zones de
     livraison France, Union europeenne, international ; calcul des frais de
     port ; seuils de livraison offerte ; regles selon le poids, le nombre de
     bouteilles ou le pays ; transporteurs ; etiquettes ; suivi ; retours ;
     retrait en boutique ou au restaurant.

     AUCUN TARIF N EST ECRIT ICI, parce qu aucun n est arrete : ni le poids
     d une bouteille pleine, ni le transporteur, ni les pays autorises. Une
     grille de port inventee est une promesse que la maison devra rompre au
     premier colis. La page pose les cases et nomme ce qui les remplira.
     Le droit de retractation et ses exceptions relevent du conseil : ils sont
     renvoyes aux CGV, ils ne sont pas rediges ici.
     ========================================================================= -->

<body data-page=""
      data-titre-fr="Livraison et retours. Ivresse d'Amour, Toloache Legitimo"
      data-titre-es="Envíos y devoluciones. Ivresse d'Amour, Toloache Legitimo"
      data-titre-en="Delivery and returns. Ivresse d'Amour, Toloache Legitimo">

<main class="page">

  <section class="entete-page">
    <div class="boite">
      <p class="kicker" data-fr="Le colis" data-es="El envío" data-en="The parcel"></p>
      <h1 data-fr="Livraison et retours" data-es="Envíos y devoluciones" data-en="Delivery and returns"></h1>
      <p class="chapo"
         data-fr="France, Union européenne, international. Une bouteille de verre pleine d'alcool ne voyage pas comme un livre : le pays, le poids et le transporteur décident ensemble."
         data-es="Francia, Unión Europea, internacional. Una botella de vidrio llena de alcohol no viaja como un libro: el país, el peso y el transportista deciden juntos."
         data-en="France, European Union, international. A glass bottle full of alcohol does not travel like a book: the country, the weight and the carrier decide together."></p>
    </div>
  </section>

  <!-- ===================================================================
       CE QUI FIXE LE PRIX DU PORT. Trois variables, aucune arretee.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Ce qui fixe le port" data-es="Lo que fija el envío" data-en="What sets the postage"></p>
      <div class="colonne fondu">
        <h2 data-fr="Trois variables" data-es="Tres variables" data-en="Three variables"></h2>
        <p data-fr="Le pays d'arrivée, qui dit d'abord si l'alcool peut y entrer. Le poids réel du colis, verre compris et calage compris. Le nombre de bouteilles, parce qu'une seule bouteille coûte presque autant à protéger que trois."
           data-es="El país de llegada, que dice primero si el alcohol puede entrar. El peso real del bulto, con el vidrio y el acolchado incluidos. El número de botellas, porque una sola botella cuesta casi tanto de proteger como tres."
           data-en="The receiving country, which first says whether alcohol may enter at all. The real weight of the parcel, glass and packing included. The number of bottles, because one bottle costs nearly as much to protect as three."></p>
        <p data-fr="Les frais s'affichent à la commande, avant le paiement, selon le pays et le nombre de bouteilles."
           data-es="Los gastos se muestran al pedir, antes del pago, según el país y el número de botellas."
           data-en="Costs are shown at checkout, before payment, by country and number of bottles."></p><!-- aucune des trois valeurs n est arretee a ce jour -->
      </div>
      <dl class="faits fondu">
        <div class="faits__l"><dt class="faits__k" data-fr="Contenant" data-es="Contenido" data-en="Volume"></dt>
          <dd class="faits__v">700 ml</dd></div>
        <!-- A REMPLIR PAR LA MAISON (Poids d'une bouteille pleine) :
        <div class="faits__l"><dt class="faits__k" data-fr="Poids d'une bouteille pleine" data-es="Peso de una botella llena" data-en="Weight of a full bottle"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À confirmer" data-es="Por confirmar" data-en="To be confirmed"></span></dd></div>
        -->
        <!-- A REMPLIR PAR LA MAISON (Bouteilles par colis) :
        <div class="faits__l"><dt class="faits__k" data-fr="Bouteilles par colis" data-es="Botellas por bulto" data-en="Bottles per parcel"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À confirmer" data-es="Por confirmar" data-en="To be confirmed"></span></dd></div>
        -->
        <!-- A REMPLIR PAR LA MAISON (Transporteurs) :
        <div class="faits__l"><dt class="faits__k" data-fr="Transporteurs" data-es="Transportistas" data-en="Carriers"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À venir, parmi ceux qui acceptent l'alcool" data-es="Por venir, entre los que aceptan el alcohol" data-en="To come, among those that accept alcohol"></span></dd></div>
        -->
        <div class="faits__l"><dt class="faits__k" data-fr="Suivi" data-es="Seguimiento" data-en="Tracking"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Selon le transporteur retenu" data-es="Según el transportista elegido" data-en="Depending on the carrier chosen"></span></dd></div>
      </dl>
    </div>
  </section>

  <!-- ===================================================================
       LES ZONES. Memes zones que la page distribution, memes reserves.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Les zones" data-es="Las zonas" data-en="The zones"></p>
      <h2 data-fr="Où la maison expédie" data-es="Dónde envía la casa" data-en="Where the house ships"></h2>
      <dl class="faits fondu">
        <div class="faits__l"><dt class="faits__k" data-fr="France" data-es="Francia" data-en="France"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Calculé à la commande" data-es="Calculado al pedir" data-en="Calculated at checkout"></span></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Union européenne" data-es="Unión Europea" data-en="European Union"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Calculé à la commande, pays par pays" data-es="Calculado al pedir, país por país" data-en="Calculated at checkout, country by country"></span></dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="International" data-es="Internacional" data-en="International"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Calculé à la commande, pays autorisés seulement" data-es="Calculado al pedir, solo países autorizados" data-en="Calculated at checkout, permitted countries only"></span></dd></div>
        <!-- A REMPLIR PAR LA MAISON (Port offert) :
        <div class="faits__l"><dt class="faits__k" data-fr="Port offert" data-es="Envío gratuito" data-en="Free postage"></dt>
          <dd class="faits__v"><span class="mention" data-fr="À confirmer" data-es="Por confirmar" data-en="To be confirmed"></span></dd></div>
        -->
        <div class="faits__l"><dt class="faits__k" data-fr="Délais" data-es="Plazos" data-en="Lead times"></dt>
          <dd class="faits__v"><span class="mention" data-fr="Selon le transporteur" data-es="Según el transportista" data-en="According to the carrier"></span></dd></div>
      </dl>
      <div class="colonne">
        <p data-fr="Les pays où la vente et l'expédition d'alcool sont autorisées sont établis sur la page distribution. Un pays absent de cette liste n'est pas livré, quel que soit le tarif."
           data-es="Los países donde la venta y el envío de alcohol están autorizados se establecen en la página distribución. Un país ausente de esa lista no se sirve, sea cual sea la tarifa."
           data-en="The countries where the sale and shipping of alcohol are allowed are set out on the distribution page. A country absent from that list is not delivered to, whatever the rate."></p>
        <p><a class="lien-discret" href="distribution.html" data-fr="Distribution" data-es="Distribución" data-en="Distribution"></a></p>
      </div>
    </div>
  </section>

  <!-- ===================================================================
       LA REMISE. Un colis d alcool se remet a une personne majeure, et le
       retrait au restaurant est demande par la famille au point 7 du brief.
       =================================================================== -->
  <section class="section section--creme">
    <div class="boite">
      <p class="kicker" data-fr="La remise" data-es="La entrega" data-en="Handing over"></p>
      <h2 data-fr="À qui le colis est remis" data-es="A quién se entrega el bulto" data-en="Who the parcel is handed to"></h2>
      <div class="colonnes-2">
        <div>
          <p class="kicker" data-fr="Personne majeure" data-es="Persona mayor de edad" data-en="Person of legal age"></p>
          <p data-fr="Un colis d'alcool se remet à une personne ayant l'âge légal du pays d'arrivée. La règle exacte, et la pièce demandée à la remise, dépendent du transporteur et du pays."
             data-es="Un bulto de alcohol se entrega a una persona con la edad legal del país de llegada. La regla exacta, y el documento pedido en la entrega, dependen del transportista y del país."
             data-en="A parcel of alcohol is handed to a person of the legal age of the receiving country. The exact rule, and the document asked for on delivery, depend on the carrier and the country."></p><!-- regle et piece a ecrire et valider avant la premiere expedition -->
        </div>
        <div>
          <p class="kicker" data-fr="Retrait au restaurant" data-es="Recogida en el restaurante" data-en="Pick up at the restaurant"></p>
          <p data-fr="Le retrait chez Toloache, 49 rue de Clignancourt, Paris 18e, est possible aux heures d'ouverture du restaurant."
             data-es="La recogida en Toloache, 49 rue de Clignancourt, París 18, es posible en el horario del restaurante."
             data-en="Pick-up at Toloache, 49 rue de Clignancourt, Paris 18, is possible during the restaurant's opening hours."></p>
          <p><a class="lien-discret" href="points-de-vente.html" data-fr="Points de vente" data-es="Puntos de venta" data-en="Stockists"></a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================================================================
       LES RETOURS. Terrain juridique : on nomme les cas, on n ecrit pas le
       droit. Le texte qui engage la maison est dans les CGV, ecrit par un
       conseil.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Les retours" data-es="Las devoluciones" data-en="Returns"></p>
      <h2 data-fr="Casse, erreur, rétractation" data-es="Rotura, error, desistimiento" data-en="Breakage, error, withdrawal"></h2>
      <div class="colonne">
        <!-- Texte a ecrire et valider par un conseil avant l ouverture de la vente. -->
        <p data-fr="Trois cas se distinguent. Une bouteille cassée en transport est un litige avec le transporteur, réglé sur constat à la livraison. Une erreur d'envoi est une erreur de la maison, et la maison la reprend. Le droit de rétractation, ses délais et ses exceptions relèvent du droit de la consommation et du droit de l'alcool : ils sont fixés dans les conditions générales de vente."
           data-es="Se distinguen tres casos. Una botella rota en el transporte es un litigio con el transportista, resuelto con constancia en la entrega. Un error de envío es un error de la casa, y la casa lo recoge. El derecho de desistimiento, sus plazos y sus excepciones dependen del derecho del consumo y del derecho del alcohol: se fijan en las condiciones generales de venta."
           data-en="Three cases stand apart. A bottle broken in transit is a dispute with the carrier, settled on a record made at delivery. A wrong shipment is the fault of the house, and the house takes it back. The right of withdrawal, its time limits and its exceptions belong to consumer law and to alcohol law: they are set in the terms of sale."></p>
        <p data-fr="Seul le texte des conditions générales de vente engage la maison."
           data-es="Solo el texto de las condiciones generales de venta compromete a la casa."
           data-en="Only the text of the terms of sale binds the house."></p>
        <p><a class="lien-discret" href="cgv.html" data-fr="Conditions générales de vente" data-es="Condiciones generales de venta" data-en="Terms of sale"></a></p>
      </div>
    </div>
  </section>

  <section class="section section--serre section--filet">
    <div class="boite centre">
      <a class="lien-discret" href="contact.html"
         data-fr="Une question sur un envoi" data-es="Una pregunta sobre un envío" data-en="A question about a shipment"></a>
    </div>
  </section>

</main>
