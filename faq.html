  <!-- ===================================================================
       1. LE MEZCAL. Les trois questions de categorie, repondues sur la norme.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Le mezcal" data-es="El mezcal" data-en="The mezcal"></p>
      <div class="colonne fondu">

        <h3 data-fr="Qu'est-ce qu'un mezcal artesanal ?"
            data-es="¿Qué es un mezcal artesanal?"
            data-en="What is a mezcal artesanal?"></h3>
        <p data-fr="C'est une des trois catégories de la norme mexicaine du mezcal, et elle se définit par le procédé, pas par le goût. Cuisson des cœurs d'agave dans un four de puits ou de maçonnerie. Mouture au maillet, à la tahona, au molino ou au trapiche. Fermentation en creux de pierre, de sol ou de tronc, en cuve de maçonnerie, de bois, de terre cuite ou en peau. Distillation au feu direct, en alambic de cuivre ou en olla de terre. Les trois bouteilles de la maison portent cette catégorie sur leur étiquette."
           data-es="Es una de las tres categorías de la norma mexicana del mezcal, y se define por el proceso, no por el sabor. Cocción de los corazones de agave en horno de pozo o de mampostería. Molienda con mazo, tahona, molino o trapiche. Fermentación en oquedades de piedra, suelo o tronco, en pilas de mampostería, recipientes de madera, barro o pieles. Destilación a fuego directo, en alambique de cobre o en olla de barro. Las tres botellas de la casa llevan esa categoría en su etiqueta."
           data-en="It is one of the three categories of the Mexican mezcal standard, and it is defined by the process, not by the taste. The agave hearts are cooked in a pit or masonry oven. Milling with a mallet, a tahona, a mill or a trapiche. Fermentation in hollows of stone, earth or tree trunk, in masonry, wooden or clay vessels, or in hides. Distillation over direct fire, in a copper still or a clay pot. The three bottles of the house carry that category on their label."></p>

        <h3 data-fr="Qu'est-ce que la denominación de origen ?"
            data-es="¿Qué es la denominación de origen?"
            data-en="What is the denominación de origen?"></h3>
        <p data-fr="C'est la protection du nom mezcal, accordée le 28 novembre 1994 et détenue par l'État mexicain. Elle délimite une aire géographique : un distillat d'agave fait en dehors de cette aire ne peut pas s'appeler mezcal. Villa Sola de Vega, dans l'État d'Oaxaca, est dedans. La norme fixe les catégories, les classes et les analyses, et un organisme évaluateur de la conformité certifie chaque producteur."
           data-es="Es la protección del nombre mezcal, otorgada el 28 de noviembre de 1994 y cuya titularidad es del Estado mexicano. Delimita un área geográfica: un destilado de agave hecho fuera de esa área no puede llamarse mezcal. Villa Sola de Vega, en el estado de Oaxaca, está dentro. La norma fija las categorías, las clases y los análisis, y un organismo evaluador de la conformidad certifica a cada productor."
           data-en="It is the protection of the name mezcal, granted on 28 November 1994 and held by the Mexican State. It delimits a geographic area: an agave distillate made outside that area cannot be called mezcal. Villa Sola de Vega, in the state of Oaxaca, is inside it. The standard sets the categories, the classes and the analyses, and a conformity assessment body certifies each producer."></p>

        <h3 data-fr="Que veut dire joven ?"
            data-es="¿Qué quiere decir joven?"
            data-en="What does joven mean?"></h3>
        <p data-fr="Joven, ou blanco, est la classe d'un mezcal incolore qui n'a subi aucun passage après la distillation : ni verre, ni bois, ni ajout. C'est la classe des trois bouteilles de la maison. Rien n'est reposé, rien n'est vieilli, rien n'est aromatisé."
           data-es="Joven, o blanco, es la clase de un mezcal incoloro que no ha pasado por nada después de la destilación: ni vidrio, ni madera, ni añadido. Es la clase de las tres botellas de la casa. Nada está reposado, nada está añejado, nada está abocado."
           data-en="Joven, or blanco, is the class of a colourless mezcal that has gone through nothing after distillation: no glass, no wood, no addition. It is the class of the three bottles of the house. Nothing is rested, nothing is aged, nothing is flavoured."></p>

      </div>
    </div>
  </section>

  <!-- ===================================================================
       2. LA PLANTE ET LE REGISTRE. Les questions qui touchent a la rarete se
       repondent par le registre, jamais par une rarete fabriquee.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="La plante et le registre" data-es="La planta y el registro" data-en="The plant and the register"></p>
      <div class="colonne fondu">

        <h3 data-fr="Pourquoi n'y a-t-il pas de tobalá certaines années ?"
            data-es="¿Por qué algunos años no hay tobalá?"
            data-en="Why is there no tobalá some years?"></h3>
        <p data-fr="Le tobalá est un agave sauvage. Il ne fait pratiquement pas de rejets autour du pied de sa mère : il se reproduit par la graine, il germe mal et il pousse lentement. La maison compte neuf ans avant qu'un pied soit mûr. Si la plante ne donne pas, il n'y a pas de lot cette année là, le registre l'écrit et la maison ne remplace rien. La plante décide."
           data-es="El tobalá es un agave silvestre. Casi no da hijuelos alrededor de la madre: se reproduce por semilla, germina mal y crece despacio. La casa cuenta nueve años antes de que una planta esté madura. Si la planta no da, no hay lote ese año, el registro lo escribe y la casa no sustituye nada. La planta decide."
           data-en="Tobalá is a wild agave. It puts out almost no offshoots around the mother plant: it reproduces by seed, it germinates poorly and it grows slowly. The house counts nine years before a plant is ripe. If the plant does not give, there is no lot that year, the register says so and the house replaces nothing. The plant decides."></p>

        <h3 data-fr="Que veut dire le numéro écrit à la main sur ma bouteille ?"
            data-es="¿Qué quiere decir el número escrito a mano en mi botella?"
            data-en="What does the handwritten number on my bottle mean?"></h3>
        <p data-fr="C'est le rang de votre bouteille dans son lot : un numéro sur un total. Il n'est pas gravé, il est écrit à la main, une bouteille après l'autre. C'est aussi la clé du registre : il ouvre la page du lot d'où votre bouteille est sortie."
           data-es="Es el lugar de su botella dentro de su lote: un número sobre un total. No está grabado, está escrito a mano, una botella tras otra. Es también la llave del registro: abre la página del lote del que salió su botella."
           data-en="It is the rank of your bottle within its lot: a number out of a total. It is not engraved, it is written by hand, one bottle after another. It is also the key to the register: it opens the page of the lot your bottle came from."></p>

        <h3 data-fr="Comment lire le registre ?"
            data-es="¿Cómo se lee el registro?"
            data-en="How do I read the register?"></h3>
        <p data-fr="On entre par le numéro de la bouteille. La page du lot donne la parcelle, le sol, l'année, le maestro, les litres sortis, votre numéro sur le total, et le degré. Un lot épuisé reste affiché, épuisé et daté : l'archive ne se vide jamais, elle s'allonge."
           data-es="Se entra por el número de la botella. La página del lote da la parcela, el suelo, el año, el maestro, los litros salidos, su número sobre el total, y la graduación. Un lote agotado queda visible, agotado y fechado: el archivo nunca se vacía, se alarga."
           data-en="You enter through the bottle number. The page of the lot gives the plot, the soil, the year, the maestro, the litres drawn, your number out of the total, and the strength. A sold out lot stays visible, sold out and dated: the archive never empties, it lengthens."></p>

      </div>
    </div>
  </section>

  <!-- ===================================================================
       3. A TABLE. Le service, dit par la maison elle meme.

        <h3 data-fr="Comment se sert-il ?"
            data-es="¿Cómo se sirve?"
            data-en="How is it served?"></h3>
        <p data-fr="Nature, à température ambiante. Le service se joue entre le verre et la jícara, la petite coupe de calebasse d'Oaxaca."
           data-es="Solo, a temperatura ambiente. El servicio se juega entre el vaso y la jícara, la pequeña copa de calabaza de Oaxaca."
           data-en="Neat, at room temperature. The serve is played between the glass and the jícara, the small gourd cup of Oaxaca."></p>

        <h3 data-fr="Avec quoi le boire ?"
            data-es="¿Con qué beberlo?"
            data-en="What to drink it with?"></h3>
        <p data-fr="Un accord par bouteille, ce sont les leurs : le coyote avec la tomate, le tobalá avec un comté de douze mois, l'espadín avec presque tout. À Oaxaca, il se boit aussi avec des insectes salés : toritos, chicatanas, grillons au sel."
           data-es="Un maridaje por botella, son los suyos: el coyote con el tomate, el tobalá con un comté de doce meses, el espadín con casi todo. En Oaxaca se bebe también con insectos salados: toritos, chicatanas, grillos con sal."
           data-en="One pairing per bottle, and they are theirs: the coyote with tomato, the tobalá with a twelve month comté, the espadín with almost anything. In Oaxaca it is also drunk with salted insects: toritos, chicatanas, crickets with salt."></p>

      </div>
    </div>
  </section>
