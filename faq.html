  <!-- ===================================================================
       1. LE MEZCAL. Les trois questions de categorie, repondues sur la norme.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="Le mezcal" data-es="El mezcal" data-en="The mezcal"></p>
      <div class="colonne fondu">

        <h3 data-fr="Qu'est-ce qu'un mezcal artesanal ?"
            data-es="¿Qué es un mezcal artesanal?"
            data-en="What is a mezcal artesanal?"></h3>
        <p data-fr="Il s'agit d'une des trois catégories officielles du mezcal, définie par sa méthode d'élaboration : cuisson des agaves dans un four creusé en terre ou en pierre, broyage à la tahona ou au maillet, fermentation en cuves de bois, de pierre ou de terre, et distillation à feu nu en alambic de cuivre ou d'argile. Nos trois mezcals relèvent de cette catégorie."
           data-es="Es una de las tres categorías oficiales del mezcal, definida por su método de elaboración: cocción de los agaves en horno de pozo de tierra o de piedra, molienda con tahona o mazo, fermentación en tinas de madera, piedra o tierra, y destilación a fuego directo en alambique de cobre o en olla de barro. Nuestros tres mezcales entran en esta categoría."
           data-en="It is one of the three official categories of mezcal, defined by the way it is made: cooking the agaves in an earthen or stone pit oven, crushing them with a tahona or a mallet, fermenting in wood, stone or earthen vats, and distilling over direct fire in a copper or clay still. All three of our mezcals belong to this category."></p>

        <h3 data-fr="Qu'est-ce que la denominación de origen ?"
            data-es="¿Qué es la denominación de origen?"
            data-en="What is the denominación de origen?"></h3>
        <p data-fr="Créée en 1994, l'appellation d'origine protège le nom mezcal et délimite son aire géographique de production, dont fait partie Villa Sola de Vega, à Oaxaca. Chaque lot est certifié par un organisme officiel qui contrôle le respect des méthodes et les analyses du distillat."
           data-es="Creada en 1994, la denominación de origen protege el nombre mezcal y delimita su área geográfica de producción, de la que forma parte Villa Sola de Vega, en Oaxaca. Cada lote es certificado por un organismo oficial que verifica el respeto de los métodos y los análisis del destilado."
           data-en="Created in 1994, the designation of origin protects the name mezcal and defines its geographical production area, which includes Villa Sola de Vega in Oaxaca. Each batch is certified by an official body that checks the production methods and analyses the distillate."></p>

        <h3 data-fr="Que veut dire joven ?"
            data-es="¿Qué quiere decir joven?"
            data-en="What does joven mean?"></h3>
        <p data-fr="Un mezcal joven (ou blanco) est mis en bouteille directement après la distillation, sans vieillissement sous bois ni aucun ajout."
           data-es="Un mezcal joven (o blanco) se embotella directamente después de la destilación, sin paso por madera ni ningún añadido."
           data-en="A joven (or blanco) mezcal is bottled straight after distillation, with no wood ageing and nothing added."></p>

      </div>
    </div>
  </section>

  <!-- ===================================================================
       2. LA PLANTE ET LE REGISTRE. Les questions qui touchent a la rarete se
       repondent par le registre, jamais par une rarete fabriquee.
       =================================================================== -->
  <section class="section section--filet">
    <div class="boite">
      <p class="kicker" data-fr="La plante et le registre" data-es="La planta y el registro" data-en="The plant and the register"></p>
      <div class="colonne fondu">

        <h3 data-fr="Pourquoi n'y a-t-il pas de tobalá certaines années ?"
            data-es="¿Por qué algunos años no hay tobalá?"
            data-en="Why is there no tobalá some years?"></h3>
        <p data-fr="Le tobalá est un agave sauvage qui se reproduit presque uniquement par la graine et met environ neuf ans à mûrir. Nous ne produisons un lot que les années où suffisamment de plantes arrivent à maturité."
           data-es="El tobalá es un agave silvestre que se reproduce casi únicamente por semilla y tarda unos nueve años en madurar. Solo producimos un lote los años en que suficientes plantas alcanzan la madurez."
           data-en="Tobalá is a wild agave that reproduces almost only by seed and takes around nine years to mature. We only make a batch in years when enough plants are ripe."></p>

        <h3 data-fr="Que veut dire le numéro écrit à la main sur ma bouteille ?"
            data-es="¿Qué quiere decir el número escrito a mano en mi botella?"
            data-en="What does the handwritten number on my bottle mean?"></h3>
        <p data-fr="Il indique le numéro de votre bouteille et le nombre total de bouteilles du lot. En le saisissant dans le registre, vous accédez à l'origine et aux détails de cette cuvée."
           data-es="Indica el número de tu botella y el total de botellas del lote. Al ingresarlo en el registro, accedes al origen y a los detalles de esa producción."
           data-en="It shows the number of your bottle and the total number of bottles in the batch. Entering it in the register gives you the origin and the details of that run."></p>

        <h3 data-fr="Comment lire le registre ?"
            data-es="¿Cómo se lee el registro?"
            data-en="How do I read the register?"></h3>
        <p data-fr="En entrant le numéro de votre bouteille, vous consultez la parcelle d'origine, la nature du sol, l'année de récolte, le nom du maestro mezcalero, le volume distillé et le degré. Tous les lots passés restent archivés."
           data-es="Al ingresar el número de tu botella, puedes consultar la parcela de origen, el tipo de suelo, el año de cosecha, el nombre del maestro mezcalero, el volumen destilado y la graduación. Todos los lotes anteriores quedan archivados."
           data-en="By entering your bottle number, you can look up the plot of origin, the type of soil, the harvest year, the name of the maestro mezcalero, the volume distilled and the proof. All past batches remain in the archive."></p>

      </div>
    </div>
  </section>

  <!-- ===================================================================
       3. A TABLE. Le service, dit par la maison elle meme.
       =================================================================== -->
  <section class="section section--creme">
    <div class="boite">
      <p class="kicker" data-fr="À table" data-es="En la mesa" data-en="At the table"></p>
      <div class="colonne fondu">

        <h3 data-fr="Comment se sert-il ?"
            data-es="¿Cómo se sirve?"
            data-en="How is it served?"></h3>
        <p data-fr="Nature, à température ambiante. Le service se joue entre le verre et la jícara, la petite coupe de calebasse d'Oaxaca."
           data-es="Solo, a temperatura ambiente. El servicio se juega entre el vaso y la jícara, la pequeña copa de calabaza de Oaxaca."
           data-en="Neat, at room temperature. It is served either in a glass or in a jícara, the small gourd cup from Oaxaca."></p>

        <h3 data-fr="Avec quoi le boire ?"
            data-es="¿Con qué beberlo?"
            data-en="What to drink it with?"></h3>
        <p data-fr="Nous aimons servir le coyote avec des tomates fraîches, le tobalá avec un comté de douze mois, et l'espadín avec des quartiers d'orange. À Oaxaca, on les accompagne aussi d'insectes salés : toritos, fourmis chicatanas et grillons."
           data-es="Nos gusta servir el coyote con jitomate fresco, el tobalá con un queso comté de doce meses y el espadín con gajos de naranja. En Oaxaca también se acompañan con insectos salados: toritos, hormigas chicatanas y chapulines."
           data-en="We like to serve the coyote with fresh tomatoes, the tobalá with a twelve-month Comté cheese, and the espadín with orange wedges. In Oaxaca, they are also served with salted insects: toritos, chicatana ants and crickets."></p>

      </div>
    </div>
  </section>
