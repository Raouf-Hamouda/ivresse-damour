<!-- ============================================================================
     LE PANIER. Les lignes, les quantites, le retrait d une ligne, le sous
     total, et la route vers commande.html. Vide, il le dit calmement et
     renvoie aux trois bouteilles.

     LE PANIER N EST PAS REECRIT ICI. Il vit dans site.js, sous ida.panier :
     window.siteChrome.panier.lire / ajouter / nombre / vider. Le compte du sac
     dans l entete se met a jour tout seul quand le panier change, parce que
     panier.ajouter appelle majPanier.

     CE QUI N EST PAS DANS CETTE PAGE, ET POURQUOI.
     Le code du jeu (5 oct 2026, decision de Raouf : 10 %) : un champ, une ligne
     de remise, le total. La logique vit dans site.js (siteChrome.remise). Pas de prix barre, pas de "plus que deux", pas de compte
     a rebours, pas de seuil de livraison offerte. Le prix monte avec le temps.
     Pas de total avec les frais d envoi : le bareme n existe pas encore, et
     un total invente serait un mensonge. On affiche le sous total, et on dit
     que l envoi manque.
     ========================================================================= -->

<body data-page=""
      data-titre-fr="Panier. Ivresse d'Amour, Toloache Legitimo"
      data-titre-es="Carrito. Ivresse d'Amour, Toloache Legitimo"
      data-titre-en="Bag. Ivresse d'Amour, Toloache Legitimo">

<main class="page">

  <section class="entete-page">
    <div class="boite">
      <h1 data-fr="Panier" data-es="Carrito" data-en="Bag"></h1>
    </div>
  </section>

  <!-- 02. LE PANIER PLEIN. Les lignes sont ecrites par le script du bas. -->
  <section class="section section--filet" id="panier-plein" hidden>
    <div class="boite">
      <p class="kicker" data-fr="Les lignes" data-es="Las líneas" data-en="The lines"></p>

      <!-- Une seule table, comme une page de registre : les lignes du panier
           d abord, ecrites par le script, puis le compte. Deux tables l une
           sous l autre donnaient deux filets colles, ce qui se voyait. -->
      <dl class="faits" id="lignes">
        <div class="faits__l">
          <dt class="faits__k" data-fr="Sous-total" data-es="Subtotal" data-en="Subtotal"></dt>
          <dd class="faits__v" id="sous-total"></dd>
        </div>
        <div class="faits__l">
          <dt class="faits__k" data-fr="Code du jeu" data-es="Código del juego" data-en="Game code"></dt>
          <dd class="faits__v">
            <form id="f-code" style="display:flex;gap:calc(var(--u)*2);align-items:center;flex-wrap:wrap" autocomplete="off">
              <label class="sr" for="code" data-fr="Code du jeu" data-es="Código del juego" data-en="Game code"></label>
              <input id="code" name="code" type="text" spellcheck="false" style="width:12ch;text-transform:uppercase" placeholder="JIMA10">
              <button class="lien-discret" type="submit" data-fr="Appliquer" data-es="Aplicar" data-en="Apply"></button>
              <span id="code-mot" class="vente__note" aria-live="polite"></span>
            </form>
          </dd>
        </div>
        <div class="faits__l" id="l-remise" hidden>
          <dt class="faits__k" data-fr="Remise du jeu, 10 %" data-es="Descuento del juego, 10 %" data-en="Game discount, 10%"></dt>
          <dd class="faits__v" id="remise"></dd>
        </div>
        <div class="faits__l" id="l-total" hidden>
          <dt class="faits__k" data-fr="Total, hors envoi" data-es="Total, sin envío" data-en="Total, before shipping"></dt>
          <dd class="faits__v" id="total-remise"></dd>
        </div>
        <div class="faits__l">
          <dt class="faits__k" data-fr="Frais d'envoi" data-es="Gastos de envío" data-en="Shipping"></dt>
          <dd class="faits__v"
              data-fr="Selon le pays et le nombre de bouteilles, affichés avant le paiement."
              data-es="Según el país y el número de botellas, mostrados antes del pago."
              data-en="By country and number of bottles, shown before payment."></dd>
        </div>
        <div class="faits__l">
          <dt class="faits__k" data-fr="Retrait" data-es="Recogida" data-en="Pickup"></dt>
          <dd class="faits__v"
              data-fr="Possible au restaurant de la famille, Toloache, à Paris. Le choix se fait à l'étape suivante."
              data-es="Posible en el restaurante de la familia, Toloache, en París. La elección se hace en el paso siguiente."
              data-en="Possible at the family restaurant, Toloache, in Paris. The choice is made at the next step."></dd>
        </div>
      </dl>

      <p style="max-width:40ch">
        <a class="b-plein" href="commande.html"
           data-fr="Continuer la commande" data-es="Continuar el pedido" data-en="Continue to checkout"></a>
      </p>

      <p>
        <button class="lien-discret" type="button" id="vider"
                data-fr="Vider le panier" data-es="Vaciar el carrito" data-en="Empty the bag"></button>
      </p>
    </div>
  </section>

  <!-- 03. LE PANIER VIDE. Une phrase calme, et le chemin du retour. -->
  <section class="section section--filet" id="panier-vide" hidden>
    <div class="boite">
      <div class="colonne">
        <h2 data-fr="Le panier est vide" data-es="El carrito está vacío" data-en="The bag is empty"></h2>
        <p data-fr="L'Espadín est disponible à la commande. Le Tobalá et le Coyote sont proposés sur allocation."
           data-es="El Espadín está disponible para pedir. El Tobalá y el Coyote se ofrecen por asignación."
           data-en="Espadín is available to order. Tobalá and Coyote are offered by allocation."></p>
        <p>
          <a class="lien-discret" href="les-mezcales.html"
             data-fr="Les trois bouteilles" data-es="Las tres botellas" data-en="The three bottles"></a>
        </p>
        <p style="margin-top:calc(var(--u)*2)">
          <a class="lien-discret" href="boutique.html"
             data-fr="La boutique" data-es="La tienda" data-en="The shop"></a>
        </p>
      </div>
    </div>
  </section>

  <!-- 04. Ce qu il faut savoir avant de continuer. Une seule section sur un
       autre papier dans la page. -->
  <section class="section section--creme">
    <div class="boite">
      <div class="colonnes-2">
        <div>
          <p class="kicker" data-fr="La loi" data-es="La ley" data-en="The law"></p>
          <p data-fr="Vente réservée aux personnes ayant l'âge légal de consommer de l'alcool dans leur pays. L'expédition n'est possible que vers les pays qui l'autorisent."
             data-es="Venta reservada a las personas con la edad legal para consumir alcohol en su país. El envío solo es posible hacia los países que lo autorizan."
             data-en="Sale restricted to those of legal drinking age in their country. Shipping is only possible to countries that allow it."></p><!-- liste des pays a confirmer par la maison -->
        </div>
        <div>
          <p class="kicker" data-fr="Le paiement" data-es="El pago" data-en="Payment"></p>
          <!-- route technique non tranchee : site statique plus Stripe Checkout, ou plateforme -->
          <p data-fr="Votre panier est prêt. Le paiement sécurisé se fait à l'étape suivante."
             data-es="Su carrito está listo. El pago seguro se hace en el paso siguiente."
             data-en="Your bag is ready. Secure payment happens at the next step."></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section section--serre section--filet">
    <div class="boite centre">
      <p><a class="lien-discret" href="boutique.html" data-fr="La boutique" data-es="La tienda" data-en="The shop"></a></p>
      <p><a class="lien-discret" href="el-registro.html" data-fr="El Registro" data-es="El Registro" data-en="El Registro"></a></p>
      <p><a class="lien-discret" href="livraison-et-retours.html" data-fr="Livraison et retours" data-es="Envío y devoluciones" data-en="Shipping and returns"></a></p>
    </div>
  </section>

</main>

<script>
siteChrome.init();

/* LE COMPTE DU SAC, AU CHARGEMENT.
   site.js appelle majPanier() avant d avoir insere l entete dans le document :
   au chargement d une page le sac affiche donc 0, meme quand le panier
   contient deux bouteilles. On ne reecrit pas le panier pour autant, on
   rappelle la fonction de la maison : ajouter zero ne change rien et remet le
   compte a jour. A corriger un jour dans site.js, en deplacant l appel a
   majPanier apres insertBefore. */
(function(){
  var c = window.siteChrome;
  if(c && c.panier && c.bouteilles && c.bouteilles.length){
    c.panier.ajouter(c.bouteilles[0].id, 0);
  }
})();
</script>
<script>
/* ---------------------------------------------------------------------------
   LES LIGNES DU PANIER.
   Le panier de site.js ne garde qu un identifiant et une quantite. Le nom, le
   latin et le prix vivent ici, une seule fois, dans l ordre de la maison.
   Le prix de l espadin, 140 euros, est celui de acheter-espadin.html. Le
   tobala et le coyote n en ont pas : on ne leur en invente pas un, et une
   ligne sans prix ne compte pas dans le sous total, elle le dit.
   ------------------------------------------------------------------------ */
(function(){
  var chrome = window.siteChrome;
  if(!chrome || !chrome.panier) return;
  var panier = chrome.panier;

  var PRIX = { espadin:140, tobala:null, coyote:null };
  var CONTENANCE = '700 ml';

  var LIGNES = {
    plein:  document.getElementById('panier-plein'),
    vide:   document.getElementById('panier-vide'),
    liste:  document.getElementById('lignes'),
    total:  document.getElementById('sous-total')
  };

  /* 1 400 et non 1400 : l espace fine insecable, comme sur une facture. */
  function euros(n){
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' €';
  }

  function bouteille(id){
    var b = chrome.bouteilles || [];
    for(var i=0;i<b.length;i++){ if(b[i].id === id) return b[i]; }
    return null;
  }

  function options(q){
    var max = Math.max(9, q), s = '', i;
    for(i=1;i<=max;i++){
      s += '<option value="' + i + '"' + (i === q ? ' selected' : '') + '>' + i + '</option>';
    }
    return s;
  }

  function ligne(id, q){
    var b = bouteille(id);
    if(!b) return '';
    var prix = PRIX[id];
    var nom = b.fr;   /* Espadín, Tobalá, Coyote : le meme mot dans les trois langues */

    var droite, note = '';
    if(prix === null || prix === undefined){
      /* Une bouteille sans prix ne peut pas etre commandee. On ne la chiffre
         pas, on ne la cache pas non plus : on dit pourquoi elle est la et
         pourquoi elle ne pese pas dans le sous total. */
      droite =
        '<span data-fr="Prix non fixé" data-es="Precio no fijado" data-en="Price not set"></span>';
      note =
        '<p class="vente__note" style="margin-top:calc(var(--u)*1.5)" ' +
          'data-fr="Sans prix arrêté, cette bouteille ne se commande pas et ne compte pas dans le sous-total." ' +
          'data-es="Sin precio fijado, esta botella no se pide y no cuenta en el subtotal." ' +
          'data-en="With no price set, this bottle cannot be ordered and does not count in the subtotal."></p>';
    } else {
      droite =
        '<label class="sr" for="q-' + id + '" data-fr="Quantité" data-es="Cantidad" data-en="Quantity"></label>' +
        '<select id="q-' + id + '" data-q="' + id + '" style="width:auto">' + options(q) + '</select>' +
        '<span style="min-width:7ch;text-align:right">' + euros(prix * q) + '</span>';
    }

    return '' +
      '<div class="faits__l" data-ligne="1">' +
        '<dt class="faits__k">' + nom + '</dt>' +
        '<dd class="faits__v">' +
          '<div style="display:flex;flex-wrap:wrap;gap:calc(var(--u)*3);align-items:center;justify-content:space-between">' +
            '<span>' +
              '<span style="font-style:italic">' + b.latin + '</span>, ' + CONTENANCE +
              (prix === null || prix === undefined ? '' :
                ' · ' + euros(prix) + ' <span data-fr="l\'unité" data-es="la unidad" data-en="each"></span>') +
            '</span>' +
            '<span style="display:flex;gap:calc(var(--u)*2);align-items:center">' + droite + '</span>' +
          '</div>' + note +
          '<p style="margin-top:calc(var(--u)*1.5)">' +
            '<button class="lien-discret" type="button" data-retirer="' + id + '" ' +
              'data-fr="Retirer" data-es="Quitar" data-en="Remove"></button>' +
          '</p>' +
        '</dd>' +
      '</div>';
  }

  function dessiner(){
    var p = panier.lire();
    var ordre = (chrome.bouteilles || []).map(function(b){ return b.id; });
    var html = '', total = 0, n = 0, i, id, q;

    for(i=0;i<ordre.length;i++){
      id = ordre[i];
      q = p[id] | 0;
      if(q < 1) continue;
      n += q;
      if(typeof PRIX[id] === 'number') total += PRIX[id] * q;
      html += ligne(id, q);
    }

    /* on n efface que les lignes du panier, le compte reste ecrit dans la page */
    var vieilles = LIGNES.liste.querySelectorAll('[data-ligne]');
    for(i=0;i<vieilles.length;i++){ vieilles[i].parentNode.removeChild(vieilles[i]); }
    LIGNES.liste.insertAdjacentHTML('afterbegin', html);

    LIGNES.total.textContent = euros(total);
    var taux = chrome.remise ? chrome.remise.taux() : 0, moins = Math.round(total * taux * 100) / 100;
    document.getElementById('l-remise').hidden = document.getElementById('l-total').hidden = !(taux && total);
    document.getElementById('remise').textContent = '− ' + euros(moins);
    document.getElementById('total-remise').textContent = euros(total - moins);
    var champ = document.getElementById('code'); if(champ && !champ.value && chrome.remise) champ.value = chrome.remise.lire() || '';
    LIGNES.plein.hidden = n < 1;
    LIGNES.vide.hidden  = n > 0;

    /* le HTML vient d etre injecte : on lui applique la langue courante */
    chrome.appliquerLangue(chrome.langue(), LIGNES.plein);
    brancher();
  }

  var fCode = document.getElementById('f-code');
  if(fCode) fCode.addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = document.getElementById('code').value, ok = chrome.remise && chrome.remise.poser(v), mot = document.getElementById('code-mot');
    mot.setAttribute('data-fr', ok ? 'Appliqué.' : (v ? 'Ce code n\'existe pas.' : 'Code retiré.'));
    mot.setAttribute('data-es', ok ? 'Aplicado.' : (v ? 'Este código no existe.' : 'Código retirado.'));
    mot.setAttribute('data-en', ok ? 'Applied.' : (v ? 'This code does not exist.' : 'Code removed.'));
    dessiner(); chrome.appliquerLangue(chrome.langue(), fCode);
  });

  function brancher(){
    var s = LIGNES.liste.querySelectorAll('[data-q]');
    for(var i=0;i<s.length;i++){
      s[i].addEventListener('change', function(){
        var id = this.getAttribute('data-q');
        var q = parseInt(this.value, 10) || 1;
        var actuel = panier.lire()[id] | 0;
        panier.ajouter(id, q - actuel);   /* le compte de l entete suit tout seul */
        dessiner();
      });
    }
    var r = LIGNES.liste.querySelectorAll('[data-retirer]');
    for(var j=0;j<r.length;j++){
      r[j].addEventListener('click', function(){
        var id = this.getAttribute('data-retirer');
        panier.ajouter(id, -(panier.lire()[id] | 0));
        dessiner();
      });
    }
  }

  var v = document.getElementById('vider');
  if(v) v.addEventListener('click', function(){ panier.vider(); dessiner(); });

  dessiner();
})();
</script>
</body>
</html>
