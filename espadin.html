<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/favicon.svg?v=20260902p" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png?v=20260902p" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png?v=20260902p">
<title>Espadín. Ivresse d'Amour, Toloache Legitimo</title>
<link rel="stylesheet" href="assets/css/site.css?v=20260902p">

</head>

<body data-page=""
      data-titre-fr="Espadín. Ivresse d'Amour, Toloache Legitimo"
      data-titre-es="Espadín. Ivresse d'Amour, Toloache Legitimo"
      data-titre-en="Espadín. Ivresse d'Amour, Toloache Legitimo">

<main class="page" data-accent="espadin">
  <!-- 01. Le heros de vente (31 aout) : l'objet a gauche, le sceau anime a
       droite, le nom, la provenance, la contenance, le bouton. Le modele est
       la page produit Johnnie Walker ; la bouteille n'est jamais recadree. -->
  <section class="scene scene--premiere heros-vente">
    <div class="scene__fond scene__fond--papier"></div>
    <div class="heros-vente__deux">
      <figure class="figure heros-vente__objet">
        <a href="acheter-espadin.html" class="figure__lien"><img src="assets/img/bouteilles/espadin_1200.jpg" srcset="assets/img/bouteilles/espadin_600.jpg 600w, assets/img/bouteilles/espadin_1200.jpg 1200w, assets/img/bouteilles/espadin_2000.jpg 2000w" sizes="(max-width: 700px) 100vw, 50vw" alt="" data-fr-alt="La bouteille d'espadín, verre vert taillé en piña, médaillon de cuivre, bouchon en cœur de feuilles." data-es-alt="La botella de espadín, vidrio verde tallado en piña, medallón de cobre, tapón en corazón de hojas." data-en-alt="The espadín bottle, green glass cut as a piña, copper medallion, stopper shaped as a heart of leaves." width="1999" height="1493"></a>
      </figure>
      <div class="heros-vente__droite">
        <svg class="heros-vente__sceau js-sceau-anime" viewBox="0 0 842 595" aria-hidden="true"></svg>
        <h1 class="scene__titre">Espadín</h1>
        <p class="scene__ligne" style="font-style:italic;margin:0">A. angustifolia</p>
        <p class="heros-vente__desc"
           data-fr="L'agave du village, cuit au four de terre par Gilberto Vásquez. Villa Sola de Vega, Oaxaca."
           data-es="El agave del pueblo, cocido en horno de tierra por Gilberto Vásquez. Villa Sola de Vega, Oaxaca."
           data-en="The village agave, cooked in an earth oven by Gilberto Vásquez. Villa Sola de Vega, Oaxaca."></p>
        <p class="heros-vente__contenance">700 ml, 50 %</p>
        <a class="b-plein heros-vente__acheter" href="acheter-espadin.html"
           data-fr="Acheter" data-es="Comprar" data-en="Buy now"></a>
      </div>
    </div>
  </section>

  <!-- 02. Ce qu'elle est, en une ligne. -->
  <section class="scene scene--court">
    <div class="scene__fond scene__fond--creme"></div>
    <div class="scene__texte">
      <p class="scene__kicker" data-fr="La bouteille du village" data-es="La botella del pueblo" data-en="The village bottle"></p>
      <h2 class="scene__titre" data-fr="Le village. Il se fait chaque année, il porte la marque." data-es="El pueblo. Se hace cada año, lleva la marca." data-en="The village. Made every year, it carries the mark."></h2>
    </div>
  </section>

  <!-- 03. Les faits, lus sur l'etiquette. -->
  <section class="section">
    <div class="boite">
      <p class="kicker" data-fr="Lu sur l'étiquette" data-es="Leído en la etiqueta" data-en="Read on the label"></p>
      <dl class="faits faits--etiquette">
        <div class="faits__l"><dt class="faits__k">Agave</dt><dd class="faits__v">A. angustifolia, espadin</dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Catégorie" data-es="Categoría" data-en="Category"></dt><dd class="faits__v">Mezcal Artesanal, joven, D.O.</dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Degré" data-es="Graduación" data-en="Strength"></dt><dd class="faits__v">50 %</dd><!-- 50 % Alc. Vol. : mention des trois etiquettes d exportation (CLAUDE.md section 3). Le degre exact de chaque lot se lit au registre. --></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Village" data-es="Pueblo" data-en="Village"></dt><dd class="faits__v">Villa Sola de Vega, Oaxaca</dd></div>
        <div class="faits__l"><dt class="faits__k">Maestro</dt><dd class="faits__v">Gilberto Vásquez</dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Contenant" data-es="Contenido" data-en="Volume"></dt><dd class="faits__v">700 ml</dd></div>
        <div class="faits__l"><dt class="faits__k" data-fr="Lot" data-es="Lote" data-en="Lot"></dt><dd class="faits__v" data-fr="numéro sur total" data-es="número sobre total" data-en="number over total"></dd></div>
      </dl>
      <!-- Note de chantier, retiree de la vue : photographie de la bouteille et sequence 360 attendues du Mexique.
      <p class="mention" data-fr="Photographie de la bouteille et séquence 360 attendues du Mexique."
         data-es="Fotografía de la botella y secuencia 360 pendientes de México."
         data-en="Bottle photograph and 360 sequence awaited from Mexico."></p> -->
    </div>
  </section>

  <!-- 04. LE JEU. La forme reperee chez gentle monster, "decouvrir la campagne",
       employee ici comme la porte du jeu de cette bouteille. -->
  <section class="campagne">
    <div class="campagne__fond fondu" data-embleme="botella"></div>
    <div class="campagne__texte">
      <p class="campagne__kicker" data-fr="Le jeu de la bouteille" data-es="El juego de la botella" data-en="The bottle game"></p>
      <h2 class="campagne__titre" data-fr="Le champ d'espadín" data-es="El campo de espadín" data-en="The espadín field"></h2>
      <p class="campagne__ligne" data-fr="Les rangs, la récolte, la piña. Le jeu de la bouteille du village." data-es="Los surcos, la cosecha, la piña. El juego de la botella del pueblo." data-en="The rows, the harvest, the piña. The game of the village bottle."></p>
      <a class="campagne__lien" href="campagne-espadin.html" data-fr="Voir la campagne" data-es="Ver la campaña" data-en="View the campaign"></a>
    </div>
  </section>

  <!-- 05. Le registre du lot. -->
  <section class="scene scene--court">
    <div class="scene__fond scene__fond--papier"></div>
    <div class="scene__marque" data-embleme="registro"></div>
    <div class="scene__texte">
      <p class="scene__kicker" data-fr="Le registre" data-es="El registro" data-en="The register"></p>
      <h2 class="scene__titre" data-fr="Entrez le numéro écrit à la main sur votre bouteille." data-es="Ingrese el número escrito a mano en su botella." data-en="Enter the number written by hand on your bottle."></h2>
      <a class="scene__lien" href="el-registro.html" data-fr="Voir El Registro" data-es="Ver El Registro" data-en="See El Registro"></a>
    </div>
  </section>

  <!-- 06. La vente, tenue a part du recit. -->
  <section class="scene scene--court">
    <div class="scene__fond scene__fond--creme"></div>
    <div class="scene__texte">
      <p class="scene__kicker" data-fr="L'allocation" data-es="La asignación" data-en="Allocation"></p>
      <h2 class="scene__titre" data-fr="Demander cette bouteille." data-es="Solicitar esta botella." data-en="Request this bottle."></h2>
      <a class="scene__lien" href="acheter-espadin.html" data-fr="La page d'achat" data-es="La página de compra" data-en="The purchase page"></a>
    </div>
  </section>

</main>

<script>siteChrome.init();</script>
<script>
/* Les emblemes poses dans les scenes de cette page. */
(function(){
  var els = document.querySelectorAll('[data-embleme]');
  for(var i=0;i<els.length;i++){
    var f = window['embleme_' + els[i].getAttribute('data-embleme')];
    if(typeof f === 'function'){
      els[i].innerHTML = '<svg viewBox="-120 -120 240 240" aria-hidden="true">' + f({color:'currentColor'}) + '</svg>';
    }
  }
})();
</script>
</body>
