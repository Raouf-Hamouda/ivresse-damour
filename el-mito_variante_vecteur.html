<style>
  body[data-page="mito"] .tete.est-posee,body[data-page="mito"] .tete.a-panneau{background:rgba(173,173,112,.9);border-bottom-color:rgba(43,33,24,.14)}
  body[data-page="mito"] .pan{background:rgba(173,173,112,.96);border-color:rgba(43,33,24,.14)}

  /* -------------------------------------------------------------------------
     LA HISTORIA. La page a part du contrat visuel : le seul monde de papier
     du site. Elle prend l entete, le menu, la porte d age, la langue et le
     pied de la maison comme toutes les autres (site.js). Ce qui reste ici est
     ce qui n existe nulle part ailleurs : le defilement de onze ecrans, la
     scene collante, les couches de papier, les legendes qui s allument.
     Pas de tiret cadratin dans ce fichier.

     MOTEUR (16 aout au soir, refonte pour la fluidite) :
     la scene n est plus UN svg redessine a chaque cran de defilement, mais
     une pile de svg independants (.couche), un par element de papier. Chaque
     couche est construite une fois par etat discret (l agave bleu, l agave
     violet, l eclair entier...) puis DEPLACEE par transform et opacity CSS,
     que le compositeur anime sans repeindre. Les filtres d ombre ne coutent
     donc qu au moment ou une couche change d etat, jamais a chaque image.

     COULEUR DU FOND : --historia-fond. Ancienne valeur : var(--olive-scroll),
     soit #ADAD70 (contrat visuel, olive reservee a cette page). Raouf a
     demande de changer la couleur principale : les deux essais rendus le
     16 aout au soir sont #9C9C60 (plus profond) et #C9C48D (papier olive,
     plus clair). Pour revenir en arriere, remettre var(--olive-scroll).
     ---------------------------------------------------------------------- */
  :root{
    --historia-fond:#C9C48D;             /* essai clair retenu (= --papier-olive du contrat) ; ancien : var(--olive-scroll) #ADAD70 ; essai sombre : #9C9C60 */
    --historia-grille:rgba(120,120,70,.16);
  }
  html{scroll-behavior:auto}
  body{background:var(--historia-fond)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--historia-grille) 1px,transparent 1px),linear-gradient(90deg,var(--historia-grille) 1px,transparent 1px);
    background-size:40px 40px}
  /* le pied de la maison passe au dessus de la grille, comme l ancien pied de la page */
  .pied{position:relative;z-index:1}

  .historia .scroller{position:relative;height:1100vh;z-index:1}
  /* 100svh : sur un telephone la barre du navigateur ne cache pas le bas de la scene */
  .historia .stage{position:sticky;top:0;height:100vh;height:100svh;width:100%;overflow:hidden;contain:strict}
  .historia .couche{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;
    transform-origin:50% 50%;backface-visibility:hidden}
  .historia .couche.vive{will-change:transform,opacity}
  .historia .couche.vide{visibility:hidden}
  .historia .defs{position:absolute;width:0;height:0;overflow:hidden}

  .historia .cap{position:absolute;left:50%;transform:translate3d(-50%,14px,0);width:min(760px,86vw);text-align:center;opacity:0;pointer-events:none;
    transition:opacity .28s var(--lineaire),transform .45s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}
  .historia .cap.on{opacity:1;transform:translate3d(-50%,0,0)}
  .historia .cap h1{font-weight:400;font-size:var(--t-h1);letter-spacing:var(--ls-titre);line-height:1.05}
  .historia .cap p{font-size:clamp(17px,1.9vw,26px);line-height:1.35;margin-bottom:0}
  .historia .cap .small{font-size:clamp(12px,1.2vw,16px);letter-spacing:var(--ls-petit);text-transform:uppercase;color:var(--brun);margin-top:12px}
  .historia .cap .lieu{margin-top:10px}
  /* 12vh est la valeur d origine : a 1600 x 900 elle vaut 108 px, donc 18 px
     sous l entete. Le max ne sert que sur un ecran court, ou 12vh passerait
     derriere la barre. */
  .historia .cap.top{top:max(12vh, calc(var(--tete-h) + var(--u)*2))}
  .historia .cap.mid{top:50%;transform:translate3d(-50%,calc(-50% + 14px),0)}
  .historia .cap.mid.on{transform:translate3d(-50%,-50%,0)}
  .historia .hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brun);opacity:.8;z-index:5;transition:opacity .4s var(--lineaire);
    pointer-events:none}
  .historia .hint.off{opacity:0}
  /* La fin du recit : une .section .section--serre du contrat, avec sa
     .boite .centre. Les liens gardent une hauteur de touche de 44 px. */
  .historia__fin{position:relative;z-index:1;color:var(--brun);padding-top:calc(var(--tete-h) + var(--u)*3)}
  .historia__liens{display:flex;gap:calc(var(--u)*3);justify-content:center;flex-wrap:wrap}
  .historia__liens a{display:inline-flex;align-items:center;min-height:44px;padding:0 calc(var(--u)*1.5)}

  /* telephone : les legendes gardent la place, la scene est cadree en portrait par le moteur */
  @media (max-width:700px){
    .historia .cap{width:min(760px,88vw)}
    .historia .cap p{font-size:clamp(17px,4.6vw,22px)}
    .historia .cap.top{top:max(11vh, calc(var(--tete-h) + var(--u)*3))}
  }
  @media (prefers-reduced-motion: reduce){
    .historia .cap{transition:opacity .2s var(--lineaire);transform:translate3d(-50%,0,0)}
    .historia .cap.mid{transform:translate3d(-50%,-50%,0)}
  }
</style>

<script>
/* ===== agave.js ===== */
/* agave.js : agave papier decoupe, facon video Insider.
   API globale (pas de dependance) :
     defsAgave()                         -> chaine <defs> a inserer UNE fois dans le svg
     agavePaper({x, y, scale, leaves, seed, palette, outline, flicker, shadow}) -> chaine <g>
     mound({x, y, scale})                -> chaine <g>
   Coordonnees en unites du viewBox 1600 x 900. (x,y) = point bas d'ou partent les feuilles
   (centre du sommet du monticule). Hauteur ~260 px, largeur ~340 px a scale 1.
   palette : 'bleu' | 'violet' | 'brun'.  outline 0..1 : halo blanc epais (violet frappe).
   flicker 0..1 : melange du violet vers le bleu (0 = violet plein, 1 = bleu).
   shadow : 'leaf' (defaut, ombre sous chaque feuille) | 'whole' | 'none'.
   Tout est deterministe a partir de seed. Ids prefixes ag_. */

(function () {
  'use strict';

  var PALETTES = {
    bleu: {
      backLight: ['#9eb19e', '#878c76', '#9eb19e'],
      backDark: ['#355e64', '#355e64', '#7e9b89'],
      frontLight: ['#a9b295', '#a9b295', '#9eb19e'],
      frontDark: ['#7e9b89', '#878c76', '#355e64']
    },
    violet: {
      backLight: ['#726473', '#574a5b', '#726473'],
      backDark: ['#3f3045', '#3f3045', '#3f3045'],
      frontLight: ['#726473', '#726473', '#726473'],
      frontDark: ['#574a5b', '#3f3045', '#574a5b']
    },
    brun: {
      backLight: ['#533823', '#5c432f', '#533823'],
      backDark: ['#463019', '#463019', '#463019'],
      frontLight: ['#5c432f', '#5c432f', '#533823'],
      frontDark: ['#463019', '#533823', '#463019']
    }
  };

  function rng(seed) {
    var a = (seed * 1103515245 + 12345) >>> 0;
    if (!a) a = 987654321;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexToRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(c1, c2, k) {
    if (k <= 0) return c1;
    if (k >= 1) return c2;
    var a = hexToRgb(c1), b = hexToRgb(c2), o = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(a[i] + (b[i] - a[i]) * k);
      o += (v < 16 ? '0' : '') + v.toString(16);
    }
    return o;
  }
  function f1(v) { return Math.round(v * 10) / 10; }
  function pts(arr) {
    var s = '';
    for (var i = 0; i < arr.length; i++) s += (i ? ' ' : '') + f1(arr[i][0]) + ',' + f1(arr[i][1]);
    return s;
  }

  /* profil de demi largeur le long de la feuille, t 0 (base) .. 1 (pointe) */
  function widthProfile(t) {
    var p = 0.47;
    if (t < p) return 0.36 + 0.64 * Math.sin(Math.PI / 2 * t / p);
    var u = (t - p) / (1 - p);
    return 0.45 * (1 - u) + 0.55 * Math.cos(Math.PI / 2 * u);
  }

  /* construit une feuille : retourne {outline:[..], left:[..], ridge:[..]} en coordonnees locales
     (base en 0,0 ; y vers le haut = negatif). ang en radians depuis la verticale (droite > 0). */
  function buildLeaf(ang, L, W, curv, ridgeFrac, bx, by) {
    var N = 16;
    var dx = Math.sin(ang), dy = -Math.cos(ang);
    var px = Math.cos(ang), py = Math.sin(ang);          /* perpendiculaire vers la droite de la direction */
    var P0 = [bx, by];
    var P2 = [bx + dx * L, by + dy * L];
    /* point de controle : bombe la feuille vers l'exterieur haut (la pointe retombe un peu vers l'exterieur) */
    var side = ang >= 0 ? 1 : -1;
    var c = curv * L * side;
    var P1 = [bx + dx * L * 0.5 - px * c, by + dy * L * 0.5 - py * c];
    var left = [], right = [], ridge = [];
    for (var i = 0; i <= N; i++) {
      var t = i / N;
      var mt = 1 - t;
      var sx = mt * mt * P0[0] + 2 * mt * t * P1[0] + t * t * P2[0];
      var sy = mt * mt * P0[1] + 2 * mt * t * P1[1] + t * t * P2[1];
      var tx = 2 * mt * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]);
      var ty = 2 * mt * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
      var tl = Math.sqrt(tx * tx + ty * ty) || 1;
      tx /= tl; ty /= tl;
      var nx = ty, ny = -tx;                             /* normale a gauche */
      var w = W * widthProfile(t);
      var wl = w * 2 * ridgeFrac, wr = w * 2 * (1 - ridgeFrac);
      left.push([sx + nx * wl, sy + ny * wl]);
      right.push([sx - nx * wr, sy - ny * wr]);
      ridge.push([sx, sy]);
    }
    var outline = left.slice();
    for (var j = right.length - 1; j >= 0; j--) outline.push(right[j]);
    var lightHalf = left.slice();
    for (var k = ridge.length - 1; k >= 0; k--) lightHalf.push(ridge[k]);
    return { outline: outline, light: lightHalf, ridge: ridge, tip: P2 };
  }

  function pick(arr, u) { return arr[Math.min(arr.length - 1, Math.floor(u * arr.length))]; }

  function defsAgave() {
    return '<filter id="ag_shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">' +
      '<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/></filter>' +
      '<filter id="ag_shadow_soft" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">' +
      '<feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.22"/></filter>';
  }

  function agavePaper(o) {
    o = o || {};
    var x = o.x || 0, y = o.y || 0, s = o.scale || 1;
    var n = Math.max(5, Math.min(25, Math.round(o.leaves || 13)));
    var seed = (o.seed === undefined) ? 1 : o.seed;
    var palName = o.palette || 'bleu';
    var pal = PALETTES[palName] || PALETTES.bleu;
    var outline = Math.max(0, Math.min(1, o.outline || 0));
    var flicker = Math.max(0, Math.min(1, o.flicker || 0));
    var shadow = o.shadow || 'whole';
    var R = rng(seed * 7919 + 17);

    var H = 260;                              /* hauteur de la feuille centrale */
    var nb = (n >> 1) | 1;                    /* rang arriere, impair : une feuille centrale */
    var nf = n - nb;                          /* rang avant */
    var amaxB = 74 * Math.PI / 180;
    var amaxF = 82 * Math.PI / 180;

    function lengthAt(a) {
      var u = Math.abs(a) / amaxB;
      return H * (1 - 0.27 * Math.pow(u, 1.6));
    }

    var leaves = [];
    var i, a, L, W;
    /* rang arriere */
    for (i = 0; i < nb; i++) {
      a = nb === 1 ? 0 : -amaxB + i * 2 * amaxB / (nb - 1);
      var central = (i === (nb - 1) / 2);
      a += (R() - 0.5) * 0.09 * (central ? 0.3 : 1);
      L = lengthAt(a) * (central ? 1 : 0.84 + R() * 0.18);
      W = L * (0.095 + 0.035 * Math.abs(a) / amaxB) * (0.9 + R() * 0.2);
      leaves.push({
        row: 0, ang: a, L: L, W: W,
        curv: (0.005 + R() * 0.03) * Math.min(1, Math.abs(a) / amaxB * 1.6),
        ridge: 0.48 + R() * 0.22,
        bx: (R() - 0.5) * 5, by: 2 + R() * 3,
        uL: R(), uD: R()
      });
    }
    /* rang avant, intercale */
    for (i = 0; i < nf; i++) {
      a = -amaxF + (i + 0.5) * 2 * amaxF / nf;
      a += (R() - 0.5) * 0.08;
      var edge = Math.abs(a) / amaxF;
      L = lengthAt(a) * (0.74 + R() * 0.18) * (1 - 0.45 * Math.pow(edge, 3));
      W = L * (0.105 + 0.05 * edge) * (0.9 + R() * 0.2);
      leaves.push({
        row: 1, ang: a, L: L, W: W,
        curv: (0.01 + R() * 0.035) * Math.min(1, edge * 1.4),
        ridge: 0.48 + R() * 0.22,
        bx: (R() - 0.5) * 6, by: 3 + R() * 4,
        uL: R(), uD: R()
      });
    }

    /* ordre de dessin : rang arriere de l'exterieur vers le centre, puis rang avant idem */
    leaves.sort(function (p, q) {
      if (p.row !== q.row) return p.row - q.row;
      return Math.abs(q.ang) - Math.abs(p.ang);
    });

    var geo = [];
    for (i = 0; i < leaves.length; i++) {
      var lf = leaves[i];

/* ===== foudre.js ===== */
/* foudre.js : l'eclair, le verre a shot, les flaques et le sol qui se souleve, en papier decoupe

   Fonctions globales, aucune dependance, aucun etat global. Chaque fonction retourne une chaine SVG
   a inserer dans un <g>. Coordonnees en unites du viewBox 1600 x 900. Ids prefixes "fd_".
   Les <defs> (filtres) sont fournis UNE fois par defsFoudre().

     defsFoudre()
     bolt({x, y, scale, t, smooth})       (x,y) = pointe de l'eclair (le point touche). Hauteur ~300 a scale 1.
                                          t : 0 rien, 0.33 la pointe seule, 0.66 la moitie, 1 l'eclair entier.
                                          Par defaut la revelation est par paliers (comme la video). smooth:true
                                          fait pousser l'eclair de facon continue entre les paliers (secours).

                                          fill 0..1 niveau du liquide, rise 0..1 le verre sort du sol (0 = cache).

     groundBump({x, y, scale, t})         (x,y) = ligne du sol. Le sol se souleve de ~50 px au dessus de la ligne quand t va
                                          de 0 a 1 (a t=0 il est ~110 px sous la ligne). Largeur ~1200 a scale 1,

                                          pour que le verre s'enfonce. */

(function () {

  var BLANC = '#ffffff';
  var VERRE = '#f4f2ec';
  var LIQUIDE = '#e5c271';
  var LIQUIDE_OMBRE = '#c9a75a';
  var LIQUIDE_CLAIR = '#efd58e';
  var FLAQUE = '#cabb76';           /* corps de la flaque, releve au centre dans la video */
  var FLAQUE_BORD = '#babd78';      /* bord / dessous, couleur du contrat */
  var FLAQUE_CLAIR = '#e0d897';     /* reflet sur le haut */
  var SOL_HAUT = '#7d7f52';
  var SOL_BAS = '#9c9e66';

  function n(v) { return Math.round(v * 100) / 100; }
  function clamp01(v) { v = +v; if (!(v > 0)) return 0; return v > 1 ? 1 : v; }

  function defsFoudre() {

      '<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/></filter>' +
      '<filter id="fd_ombre_fine" x="-40%" y="-40%" width="180%" height="180%">' +
      '<feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.22"/></filter>' +
      '<filter id="fd_ombre_sol" x="-10%" y="-40%" width="120%" height="180%">' +
      '<feDropShadow dx="0" dy="-3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/></filter>';
  }

  /* ---------------- L'ECLAIR ----------------
     Geometrie relevee pixel par pixel sur la video (112.000 / 112.125 / 112.500), pointe en (0,0),
     sommet en y=-300. Une barre epaisse inclinee de 12 degres qui descend, un cran vers la droite
     (bords du cran legerement obliques), puis une pointe plus fine jusqu'au sol. Coeur blanc, bord orange.
     La revelation de la video est une essuyee en chevron : la pointe seule, puis la barre avec le blanc

  var BOLT_FULL_OUT = [[-150, -300], [-97.5, -300], [-80, -211], [-17.5, -230], [0, 0], [-40, -165], [-115, -134]];

  var BOLT_TIP_OUT = [[-150, -300], [-97.5, -300], [-94, -275], [-109, -237.5], [-141, -270]];
  var BOLT_TIP_IN = [[-132, -300], [-113, -300], [-104, -252.5], [-109, -239], [-120, -249]];
  /* palier 2 : la moitie (112.125) : la barre entiere, le blanc deborde a droite (debut du cran) et se termine en pointe */
  var BOLT_HALF_OUT = [[-150, -300], [-97.5, -300], [-82.5, -197.5], [-64, -190], [-96, -162.5], [-117.5, -195]];
  var BOLT_HALF_IN = [[-132, -300], [-113, -300], [-95, -200], [-82.5, -196], [-64, -190], [-96, -164], [-111, -195]];

  function boltStage(t) {

    if (t >= 0.659) return 2;

  var APEX_PATH = [[0, -122, -330], [0.33, -109, -237.5], [0.66, -96, -162.5], [0.78, -30, -178], [1, 12, 30]];

  function bolt(o) {

      else if (stage === 2) body = poly(BOLT_HALF_OUT, ORANGE) + poly(BOLT_HALF_IN, BLANC);
      else if (stage === 3) body = poly(BOLT_FULL_OUT, ORANGE) + poly(BOLT_FULL_IN, BLANC);

      '<g clip-path="url(#' + cid + ')">' + poly(BOLT_FULL_OUT, ORANGE) + poly(BOLT_FULL_IN, BLANC) + '</g>';

    out += '<path d="M' + n(ht - G_WALL - 2.4) + ',' + n(-G_H + 1) + ' L' + n(ht - G_WALL) + ',' + n(-G_H + 1) + ' L' + n(hb - G_WALL) + ',' + n(baseTop) + ' L' + n(hb - G_WALL - 2.4) + ',' + n(baseTop) + ' Z" fill="#8f8a78" fill-opacity="0.2"/>';

        ' L' + n(lR) + ',' + n(liqTop + 2) + ' Q' + n((lL + lR) / 2) + ',' + n(liqTop + 0.6) + ' ' + n(lL) + ',' + n(liqTop + 2) + ' Z" fill="' + LIQUIDE_CLAIR + '"/>';

      light += '<path d="' + blobPath(cx, cy - 1.2, w * 0.98, h, L[4]) + '" fill="' + FLAQUE_CLAIR + '"/>';
      main += '<path d="' + blobPath(cx, cy, w, h, L[4]) + '" fill="' + FLAQUE + '"/>';

    var right = puddleShape([[0, 0, 44, 10, 2.1], [17, 2, 34, 8, 4.0]], k2);

    if (left) inner += '<g transform="translate(-106,12)">' + left + '</g>';

  }

  /* ---------------- LE SOL QUI SE SOULEVE ----------------
     Une grande bande de sol, bord superieur doucement ondule, deux tons (haut sombre, bas plus clair),

    var bandH = 50;                          /* hauteur du ton sombre */
    var dTop = wavyEdge(-half, half, top, 5, 0.7);
    var dBand = wavyEdge(-half, half, top + bandH, 4, 2.9);
    var haut = dTop + ' L' + n(half) + ',' + n(top + bandH + 20) + ' L' + n(-half) + ',' + n(top + bandH + 20) + ' Z';
    var bas = dBand + ' L' + n(half) + ',' + n(top + depth) + ' L' + n(-half) + ',' + n(top + depth) + ' Z';
    return grp(x, y, s,
      '<path d="' + haut + '" fill="' + SOL_HAUT + '"/>' +
      '<path d="' + bas + '" fill="' + SOL_BAS + '"/>', 'fd_ombre');
  }

  window.defsFoudre = defsFoudre;
  window.bolt = bolt;
  window.glass = glass;
  window.puddles = puddles;
  window.groundBump = groundBump;
})();

/* ===== lettres.js ===== */
/* lettres.js : tuiles facon rancon, flammes papier, collines, soleil + verre.
   Vanilla JS, aucune dependance. Chaque fonction retourne une chaine SVG.
   Coordonnees en unites du viewBox 1600 x 900. Ids prefixes "lt_". */

(function (global) {
  'use strict';

  var TILE = '#d9ceba';
  var RED = '#bc2a13';
  var FONT_SLAB = "'Clarendon','SuperClarendon','Rockwell','Georgia',serif";

    d.push('M -30,' + n(-bras) + ' L 30,' + n(-bras) + ' L 32,10 C 36,36 46,50 46,68 C 46,78 38,84 28,84 L -36,84 C -48,84 -56,72 -54,60 C -50,36 -36,24 -32,10 Z');
    /* doigts : index, majeur, annulaire, auriculaire */
    var base = [-32, -10, 12, 32];
    var lon = [76, 86, 80, 62];
    var spread = [-14, -5, 4, 13];
    var larg = [19, 19, 18, 16];
    for (var i = 0; i < 4; i++) {
      var ang = spread[i] * (1 + 0.25 * curl) - curl * (14 + i * 3);
      var L1 = lon[i] * 0.58, L2 = lon[i] * 0.5;
      d.push(capsule(base[i], 72, ang, L1, larg[i]));

      var a1 = ang * Math.PI / 180;
      var jx = base[i] + Math.sin(a1) * L1, jy = 72 + Math.cos(a1) * L1;
      d.push(capsule(jx, jy, ang - curl * 20, L2, larg[i] * 0.92));

    d.push(capsule(-44, 34, pang, 62, 20));

  /* deux mains : (x,y) = centre. t 0 : loin, ouvertes ; 1 : refermees autour du centre. */
  function hands(o) {
    o = o || {};
    var x = o.x || 0, y = o.y || 0, s = (o.scale == null ? 1 : o.scale);
    var t = Math.max(0, Math.min(1, o.t == null ? 1 : o.t));
    var bras = o.arm == null ? 260 : o.arm;
    var e = t * t * (3 - 2 * t);
    var curl = e;
    var forme = mainForme(curl, bras);
    /* le centre, en coordonnees locales de la main quand elle est refermee */
    var lcx = -112, lcy = 118;
    var recul = (1 - e) * 320;

    out.push('<g transform="translate(' + n(x) + ',' + n(y) + ') scale(' + n(s) + ')">');
    var mains = [{ rot: -68 }, { rot: 112 }];
    for (var i = 0; i < 2; i++) {
      var th = mains[i].rot * Math.PI / 180;

      var lx = lcx, ly = lcy + recul;

      var ox = 5 * cs + 4 * sn, oy = -5 * sn + 4 * cs;

      out.push('<path d="' + forme + '" fill="' + C.bois + '" transform="translate(' + n(ox) + ',' + n(oy) + ')"/>');
      out.push('<path d="' + forme + '" fill="' + C.boisClair + '"/>');
      out.push('</g>');
    }
    out.push('</g>');
    return out.join('');
  }

  window.defsBouteille = defsBouteille;
  window.pinaBottle = pinaBottle;
  window.hands = hands;

/* ===== medaillon.js ===== */
/* medaillon.js : le medaillon cuivre Ivresse d'Amour en papier decoupe.
   Fonctions globales, chacune retourne une chaine SVG a inserer dans un <g>.
   Coordonnees en unites du viewBox 1600 x 900. Aucune dependance, aucun etat global.
   Ids prefixes "md_". Les <defs> (filtres) sont fournis une fois par defsMedaillon().
   Le sceau est dessine dans un repere de rayon 100 puis mis a l'echelle r/100. */

(function () {
  var C = {
    cuivre: '#b27309',
    cuivreSombre: '#7d5108',
    cuivreClair: '#d29a2b',
    signe: '#5a3a06'
  };
  var FONT = "'Rockwell','Clarendon','Georgia',serif";

  function n(v) { return Math.round(v * 100) / 100; }
  function pol(rad, deg) {
    var a = deg * Math.PI / 180;
    return n(rad * Math.cos(a)) + ',' + n(rad * Math.sin(a));
  }

  function defsMedaillon() {
    return '<filter id="md_ombre" x="-30%" y="-30%" width="160%" height="170%">' +
      '<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>' +
      '<filter id="md_ombre_fine" x="-30%" y="-30%" width="160%" height="170%">' +
      '<feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.22"/></filter>' +
      '<filter id="md_ombre_hero" x="-40%" y="-40%" width="180%" height="190%">' +
      '<feDropShadow dx="4" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.28"/></filter>';
  }

  /* etoile a quatre branches, centre (cx,cy), rayon exterieur R */
  function etoile(cx, cy, R) {
    var r = R * 0.28, pts = [], i, a, rr;
    for (i = 0; i < 8; i++) {
      a = i * Math.PI / 4 - Math.PI / 2;
      rr = (i % 2 === 0) ? R : r;
      pts.push(n(cx + rr * Math.cos(a)) + ',' + n(cy + rr * Math.sin(a)));
    }
    return '<polygon points="' + pts.join(' ') + '" fill="' + C.signe + '"/>';
  }

  /* une main : celle du haut, qui vient de la gauche, passe au dessus de la fleur
     et retombe a droite, doigts vers le bas. L'autre est la meme tournee de 180 degres. */
  function main() {
    var s = '';
    var st = ' fill="none" stroke="' + C.signe + '" stroke-linecap="round" stroke-linejoin="round"';
    /* avant bras : remonte le long du bord gauche puis file vers la paume, bout coupe net */
    s += '<path d="M -55,10 C -58,-8 -59,-24 -58,-32 C -56,-46 -44,-52 -22,-54" fill="none" stroke="' + C.signe + '" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/>';
    /* paume */
    s += '<path d="M -26,-61 C -26,-64 -20,-64 -14,-64 L 12,-64 C 21,-64 24,-58 22,-52 L 19,-43 C 6,-40 -14,-40 -26,-44 Z" fill="' + C.signe + '"/>';
    /* quatre doigts presque paralleles qui se courbent vers le bas, l'index le plus long */
    s += '<path d="M 14,-60 C 34,-64 50,-58 52,-46" stroke-width="6.5"' + st + '/>';
    s += '<path d="M 18,-53 C 36,-55 50,-47 49,-33" stroke-width="6.5"' + st + '/>';
    s += '<path d="M 18,-46 C 33,-47 44,-39 43,-25" stroke-width="6.2"' + st + '/>';
    s += '<path d="M 15,-40 C 26,-40 34,-34 33,-21" stroke-width="5.8"' + st + '/>';
    /* pouce, qui descend vers la fleur */
    s += '<path d="M -10,-43 C -11,-37 -8,-33 -3,-31" stroke-width="6.5"' + st + '/>';
    return s;
  }

  /* fleur d'agave a cinq petales sur une coupe */
  function fleur() {
    var s = '', f = ' fill="' + C.signe + '"';
    /* bouton central */
    s += '<path d="M 0,-25 C 8,-13 9,4 0,12 C -9,4 -8,-13 0,-25 Z"' + f + '/>';
    /* petales interieurs */
    s += '<path d="M -17,-17 C -3,-10 4,4 -3,12 C -14,8 -21,-6 -17,-17 Z"' + f + '/>';
    s += '<path d="M 17,-17 C 3,-10 -4,4 3,12 C 14,8 21,-6 17,-17 Z"' + f + '/>';
    /* petales exterieurs, larges, qui s'ouvrent vers les cotes */
    s += '<path d="M -34,-6 C -20,-4 -8,6 -8,14 C -22,15 -34,7 -34,-6 Z"' + f + '/>';
    s += '<path d="M 34,-6 C 20,-4 8,6 8,14 C 22,15 34,7 34,-6 Z"' + f + '/>';
    /* coupe */
    s += '<path d="M -31,16 L 31,16 C 30,22 18,26 0,26 C -18,26 -30,22 -31,16 Z"' + f + '/>';
    return s;
  }

  function texteArc(id, txt, size, spacing) {
    return '<text font-family="' + FONT + '" font-weight="bold" font-size="' + size + '" letter-spacing="' + spacing +
      '" fill="' + C.signe + '" text-anchor="middle"><textPath href="#' + id + '" xlink:href="#' + id + '" startOffset="50%">' + txt + '</textPath></text>';
  }

  function sceau(o) {
    var x = o.x || 0, y = o.y || 0, r = o.r || 100;
    var t = (o.t === undefined) ? 1 : o.t;
    var k = n(r / 100);
    var uid = 'md_' + Math.round(x) + '_' + Math.round(y) + '_' + Math.round(r);
    var idH = uid + '_h', idB = uid + '_b';
    var out = [];
    out.push('<g opacity="' + n(t) + '">');
    /* disque cuivre, une seule ombre de papier pour tout le sceau */
    out.push('<g filter="url(#md_ombre)"><circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r) + '" fill="' + C.cuivre + '"/></g>');
    out.push('<g transform="translate(' + n(x) + ',' + n(y) + ') scale(' + k + ')">');
    /* jante sombre et filet clair */
    out.push('<circle r="96" fill="none" stroke="' + C.cuivreSombre + '" stroke-width="8"/>');
    out.push('<circle r="88.5" fill="none" stroke="' + C.cuivreClair + '" stroke-width="2.5"/>');
    /* chemins du texte */
    out.push('<defs><path id="' + idH + '" d="M ' + pol(71, 187) + ' A 71 71 0 0 1 ' + pol(71, 353) + '"/>' +
      '<path id="' + idB + '" d="M ' + pol(85.5, 173) + ' A 85.5 85.5 0 0 0 ' + pol(85.5, 7) + '"/></defs>');
    var fin = (r >= 70) ? ' filter="url(#md_ombre_fine)"' : '';
    out.push('<g' + fin + '>');
    out.push(texteArc(idH, "IVRESSE D'AMOUR", 16.5, 1.2));
    out.push(texteArc(idB, 'TOLOACHE LEGITIMO', 16.5, 1.2));
    /* separateurs aux flancs */
    out.push(etoile(-79, 0, 4.6));
    out.push(etoile(79, 0, 4.6));
    out.push('</g>');
    /* le signe milagro */
    out.push('<g' + fin + ' transform="scale(0.94)">');
    out.push(main());
    out.push('<g transform="rotate(180)">' + main() + '</g>');
    out.push(fleur());
    out.push(etoile(-21, -33, 3.8));
    out.push(etoile(6, -35, 3.4));
    out.push(etoile(-13, 37, 3.4));
    out.push('</g>');
    out.push('</g></g>');
    return out.join('');
  }

  function medaillon(o) { return sceau(o || {}); }

  function medaillonHero(o) {
    o = o || {};
    var t = (o.t === undefined) ? 1 : o.t;
    var inner = sceau({ x: o.x, y: o.y, r: o.r, t: 1 });
    return '<g opacity="' + n(t) + '"><g filter="url(#md_ombre_hero)">' + inner + '</g></g>';
  }

  window.defsMedaillon = defsMedaillon;
  window.medaillon = medaillon;
  window.medaillonHero = medaillonHero;
})();

/* ===== mains.js ===== */
/* mains.js : les deux mains du logo Ivresse d'Amour, en papier decoupe.
   Fonction globale hands({x, y, scale, t, part, fixe}) : retourne une chaine SVG a inserer dans un <g>.
   part : 'haut' | 'bas' | 'deux' (defaut). fixe : true = la main reste en place, seuls les doigts suivent t.
   Coordonnees en unites du viewBox 1600 x 900. Aucune dependance, aucun etat global.
   Ids prefixes "mn_". Les <defs> (filtre d'ombre) sont fournis une fois par defsMains().

   Geometrie : une seule main est dessinee (celle du haut) en coordonnees locales centrees sur (x,y),
   rayon du cercle R = 210 a scale 1. Le dos de la main suit le cercle : l'avant-bras arrive par le
   haut a droite (manchette douce), la paume est en haut, les quatre doigts s'ouvrent en eventail vers
   la gauche et redescendent le long du cercle, le pouce est replie sous la paume. La main du bas est
   la meme, tournee de 180 degres autour du centre. A t=0 la main du haut est au-dessus du cadre et
   celle du bas en dessous ; a t=1 elles se referment autour du centre, comme le sceau du logo. */

(function () {
  var CLAIR = '#c9a06a';
  var OMBRE = '#a07a4a';
  var R = 210;
  var DEG = Math.PI / 180;

  function n(v) { return Math.round(v * 100) / 100; }
  function pol(a, r) { return [r * Math.cos(a * DEG), r * Math.sin(a * DEG)]; }
  function lisse(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
  function ent(a, b, u) { return a + (b - a) * lisse(u); }

  function defsMains() {
    return '<filter id="mn_ombre" x="-25%" y="-25%" width="150%" height="150%">' +
      '<feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter>';
  }

  /* un doigt : base (bx,by), direction dir en degres (0 = +x, 90 = +y ecran), qui tourne de "turn" degres
     sur sa longueur L, largeur w0 a la base et w1 avant le bout arrondi. Contour ferme, base plate. */
  function doigt(bx, by, dir, turn, L, w0, w1) {
    var N = 10, g = [], d = [], i, u, a, x = bx, y = by, step = L / N;
    var pas = turn / N;
    /* ligne centrale : petits segments qui tournent regulierement */
    g.push([x, y, dir]);
    for (i = 1; i <= N; i++) {
      a = dir + pas * (i - 0.5);
      x += Math.cos(a * DEG) * step;
      y += Math.sin(a * DEG) * step;
      g.push([x, y, dir + pas * i]);
    }
    /* cote gauche */
    for (i = 0; i <= N; i++) {
      u = i / N;
      var w = ent(w0, w1, u) / 2;
      /* leger renflement des articulations, tres discret */
      w += Math.sin(u * Math.PI * 2) * 0.6;
      var nx = -Math.sin(g[i][2] * DEG), ny = Math.cos(g[i][2] * DEG);
      d.push((i ? 'L ' : 'M ') + n(g[i][0] + nx * w) + ',' + n(g[i][1] + ny * w));
    }
    /* bout arrondi : demi cercle de rayon w1/2 autour du dernier point */
    var tip = g[N], ta = tip[2], rr = w1 / 2, k;
    for (k = 1; k < 8; k++) {
      var b = (ta + 90 - k * 180 / 8) * DEG;
      d.push('L ' + n(tip[0] + Math.cos(b) * rr) + ',' + n(tip[1] + Math.sin(b) * rr));
    }
    /* cote droit, retour */
    for (i = N; i >= 0; i--) {
      u = i / N;
      var w2 = ent(w0, w1, u) / 2 + Math.sin(u * Math.PI * 2) * 0.6;
      var nx2 = -Math.sin(g[i][2] * DEG), ny2 = Math.cos(g[i][2] * DEG);
      d.push('L ' + n(g[i][0] - nx2 * w2) + ',' + n(g[i][1] - ny2 * w2));
    }
    d.push('Z');
    return d.join(' ');
  }

  /* avant-bras + paume, une seule forme, echantillonnee en polaire du poignet (aW) au bout de la paume (aP). */
  function brasPaume(aW, aP) {
    var d = [], a, i, N = 40;
    var rOut, rIn;
    function rayons(a) {
      /* u : 0 au poignet, 1 au bout de la paume */
      var u = (a - aW) / (aP - aW);
      /* bras : bande reguliere ; paume : plus large, bosse du dos et bourrelet du pouce vers l'interieur */
      var pa = lisse((u - 0.36) / 0.34);
      rOut = R + 21 + 13 * pa;
      rIn = R - 23 - 22 * pa;
      /* le bourrelet du pouce s'arrondit un peu vers le bout de la paume */
      rIn += 4 * lisse((u - 0.86) / 0.14);
    }
    /* bord exterieur (dos), du poignet vers les doigts */
    for (i = 0; i <= N; i++) {
      a = aW + (aP - aW) * i / N; rayons(a);
      var p = pol(a, rOut);
      d.push((i ? 'L ' : 'M ') + n(p[0]) + ',' + n(p[1]));
    }
    /* bout de la paume : ligne des articulations, legerement bombee vers les doigts */
    rayons(aP);
    var mid = pol(aP - 3.5, (rOut + rIn) / 2);
    var pin = pol(aP, rIn);
    d.push('Q ' + n(mid[0]) + ',' + n(mid[1]) + ' ' + n(pin[0]) + ',' + n(pin[1]));
    /* bord interieur (creux de la main), retour vers le poignet */
    for (i = N; i >= 0; i--) {
      a = aW + (aP - aW) * i / N; rayons(a);
      var q = pol(a, rIn);
      d.push('L ' + n(q[0]) + ',' + n(q[1]));
    }
    /* manchette douce : bout arrondi du poignet, un demi cercle vers l'exterieur du cadre */
    rayons(aW);
    var c = pol(aW, (rOut + rIn) / 2), rc = (rOut - rIn) / 2, k;
    var urx = Math.cos(aW * DEG), ury = Math.sin(aW * DEG);
    var utx = Math.cos((aW + 90) * DEG), uty = Math.sin((aW + 90) * DEG);
    for (k = 1; k < 10; k++) {
      var ph = (180 - k * 18) * DEG, cr = Math.cos(ph) * rc, ct = Math.sin(ph) * rc * 0.55;
      d.push('L ' + n(c[0] + urx * cr + utx * ct) + ',' + n(c[1] + ury * cr + uty * ct));
    }
    d.push('Z');
    return d.join(' ');
  }

  /* une main complete (celle du haut) en coordonnees locales : liste de chemins.
     ouv 0..1 : 1 = doigts un peu plus ouverts (main qui arrive), 0 = refermes autour du centre. */
  function uneMain(ouv) {
    var aW = -24, aP = -124;
    var paths = [brasPaume(aW, aP)];
    /* les doigts partent de la ligne des articulations en aP, du dos (r grand) vers le creux (r petit).
       Le plus haut (auriculaire) est court, puis ils s'allongent ; le plus bas est le plus pres du centre. */
    var tang = aP - 90;                 /* direction tangente vers les angles decroissants (vers la gauche puis le bas) */
    var base = [R + 23, R + 3, R - 17, R - 36];
    var lon = [70, 98, 112, 104];
    var evt = [6, 3, 0, -3];           /* eventail : positif = vers l'exterieur du cercle */
    var crb = [-8, -16, -26, -36];      /* courbure : le doigt du haut presque droit, celui du bas suit le cercle */
    var larg0 = [24, 25, 25, 24];
    var larg1 = [7, 8, 8, 7];
    var i;
    for (i = 0; i < 4; i++) {
      var p = pol(aP + (i ? 2.5 : 0.8), base[i]);
      /* les doigts tournent vers le centre le long de leur longueur (ils suivent le cercle) ; quand la
         main arrive ils sont un peu plus tendus */
      var turn = crb[i] * (1 - 0.5 * ouv);
      var dir = tang + evt[i] * (1 + 0.5 * ouv);
      paths.push(doigt(p[0], p[1], dir, turn, lon[i], larg0[i], larg1[i]));
    }
    /* le pouce : replie sous la paume, court et pointu, il part du bourrelet interieur et pointe
       vers l'avant, un peu vers le centre */
    var pb = pol(-106, R - 24);
    paths.push(doigt(pb[0], pb[1], 112, 10, 58, 34, 9));
    return paths;
  }

  /* deux mains : (x,y) = centre. t 0 : hors cadre (haut et bas) ; 1 : refermees autour du centre. */
  function hands(o) {
    o = o || {};
    var x = o.x || 0, y = o.y || 0, s = (o.scale == null ? 1 : o.scale);
    var t = Math.max(0, Math.min(1, o.t == null ? 1 : o.t));
    var H = o.frame == null ? 900 : o.frame;
    var e = 1 - Math.pow(1 - t, 2.5);   /* arrivee franche, fin douce */
    var paths = uneMain(1 - e);
    var forme = '';
    for (var i = 0; i < paths.length; i++) forme += '<path d="' + paths[i] + '"/>';
    /* la main du haut descend en local jusqu'a environ -45 (bout du doigt le plus bas) ; hors cadre a t=0 */
    var portee = 60 * s + 30;
    var dHaut = -(y + portee) * (1 - e);          /* monde : vers le haut */
    var dBas = ((H - y) + portee) * (1 - e);      /* monde : vers le bas */
    /* part : 'haut' | 'bas' ne dessine qu'une main ; fixe : true laisse la main a sa place finale
       (seuls les doigts suivent t). Le moteur de la page pose alors chaque main dans sa propre
       couche et la deplace par transformation CSS, sans redessiner. */
    var part = o.part || 'deux';
    if (o.fixe) { dHaut = 0; dBas = 0; }
    var out = [];
    out.push('<g transform="translate(' + n(x) + ',' + n(y) + ')">');
    /* main du haut */
    if (part !== 'bas') {
      out.push('<g transform="translate(0,' + n(dHaut) + ') scale(' + n(s) + ')" filter="url(#mn_ombre)">');
      out.push('<g fill="' + OMBRE + '" transform="translate(' + n(5 / s) + ',' + n(4 / s) + ')">' + forme + '</g>');
      out.push('<g fill="' + CLAIR + '">' + forme + '</g>');
      out.push('</g>');
    }
    /* main du bas : la meme, tournee de 180 degres autour du centre ; l'ombre reste vers le bas a droite */
    if (part !== 'haut') {
      out.push('<g transform="translate(0,' + n(dBas) + ') scale(' + n(s) + ')" filter="url(#mn_ombre)">');
      out.push('<g fill="' + OMBRE + '" transform="translate(' + n(5 / s) + ',' + n(4 / s) + ') rotate(180)">' + forme + '</g>');
      out.push('<g fill="' + CLAIR + '" transform="rotate(180)">' + forme + '</g>');
      out.push('</g>');
    }
    out.push('</g>');
    return out.join('');
  }

  window.defsMains = defsMains;
  window.hands = hands;
})();

/* ===== bords.js ===== */
/* bords.js : bords de cadre, facon video Insider (1m40 a 1m42, 1m51).
   API globale (pas de dependance sauf agave.js pour agavePaper / mound) :
     defsBords()                        -> chaine <defs> a inserer UNE fois dans le svg (avec defsAgave())
     paperGrain()                       -> chaine : grain papier + quadrillage plein cadre 1600 x 900,
                                           a poser juste apres le rect de fond kaki #adad70
     bordAgaves({t, side, scale})       -> chaine <g> : 3 a 4 grandes rosettes qui se chevauchent,
                                           ancrees au bord gauche et/ou droit, coupees par le bord,
                                           qui montent depuis le bas du cadre quand t va de 0 a 1
                                           (les rosettes du fond d'abord). side : 'gauche' | 'droite' | 'deux'.
                                           scale : multiplicateur global (defaut 1). Le centre (40 % de la
                                           largeur, x 480..1120) reste libre pour le texte.
   Coordonnees en unites du viewBox 1600 x 900. Ids prefixes bd_. Aucun etat global. */

(function () {
  'use strict';

  var W = 1600, H = 900;

  function f1(v) { return Math.round(v * 10) / 10; }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOut(p) { var q = 1 - p; return 1 - q * q * q; }

  function defsBords() {
    return '<pattern id="bd_grid" width="40" height="40" patternUnits="userSpaceOnUse">' +
        '<path d="M40,0.5 L0,0.5 M0.5,0 L0.5,40" fill="none" stroke="#8f8f56" stroke-opacity="0.3" stroke-width="1"/>' +
      '</pattern>' +
      /* grain : bruit fractal fin ; une couche sombre (effet multiply) et une couche claire tres faible
         pour que la moyenne reste au kaki #adad70 */
      '<filter id="bd_grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>' +
        '<feColorMatrix in="n" type="matrix" values="' +
          '0 0 0 0 0.33  0 0 0 0 0.33  0 0 0 0 0.22  0.45 0 0 0 -0.17" result="d"/>' +
        '<feColorMatrix in="n" type="matrix" values="' +
          '0 0 0 0 0.92  0 0 0 0 0.92  0 0 0 0 0.64  0 0.4 0 0 -0.16" result="l"/>' +
        '<feMerge><feMergeNode in="d"/><feMergeNode in="l"/></feMerge>' +
      '</filter>' +
      /* rosettes du fond : un peu plus sombres, couleurs plates gardees */
      '<filter id="bd_ombre" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">' +
        '<feColorMatrix type="matrix" values="0.8 0 0 0 0  0 0.8 0 0 0  0 0 0.86 0 0  0 0 0 1 0"/>' +
      '</filter>';
  }

  function paperGrain() {
    return '<g class="bd_paper">' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#bd_grid)"/>' +
      '<rect width="' + W + '" height="' + H + '" filter="url(#bd_grain)"/>' +
      '</g>';
  }

  /* Rosettes d'un bord, positions finales mesurees depuis le bord (dx > 0 = vers le centre), y = base
     (sous le bord bas du cadre : on ne voit que les lames, comme dans la video). depth 0 = tout au fond.
     Ordre du tableau = ordre de dessin (fond d'abord) = ordre de montee (t0..t1). */
  var CLUSTER = [
    { dx: -230, y: 1020, scale: 1.9, seed: 32, leaves:  7, depth: 0, t0: 0.00, t1: 0.50 },
    { dx:  150, y: 1060, scale: 2.2, seed: 31, leaves:  7, depth: 0, t0: 0.08, t1: 0.60 },
    { dx:   20, y: 1040, scale: 2.6, seed: 33, leaves:  9, depth: 1, t0: 0.30, t1: 0.85 },
    { dx:  260, y: 1030, scale: 1.6, seed: 34, leaves:  7, depth: 2, t0: 0.45, t1: 1.00 }
  ];
  /* variante pour le bord droit : memes places, autres graines et petites variations */
  var CLUSTER_R = [
    { dx: -210, y: 1025, scale: 1.95, seed: 42, leaves:  7, depth: 0, t0: 0.00, t1: 0.50 },
    { dx:  160, y: 1055, scale: 2.1, seed: 41, leaves:  9, depth: 0, t0: 0.10, t1: 0.62 },
    { dx:   60, y: 1035, scale: 2.65, seed: 46, leaves:  9, depth: 1, t0: 0.32, t1: 0.86 },
    { dx:  250, y: 1035, scale: 1.65, seed: 44, leaves:  7, depth: 2, t0: 0.46, t1: 1.00 }
  ];

  /* etirement : les lames de la video sont plus longues et plus dressees que celles d'agavePaper ;
     on etire la rosette (x 0.82, y 1.2) sans la redessiner. */
  var SX = 0.82, SY = 1.2;

  function oneSide(list, side, t, gs, x0, x1, plan) {
    var out = '';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      /* plan : 'fond' ne garde que les rosettes du fond (depth 0), 'devant' les autres ; sinon toutes.
         Sert au moteur de la page pour tenir deux couches qui montent chacune d'un bloc. */
      if (plan === 'fond' && r.depth !== 0) continue;
      if (plan === 'devant' && r.depth === 0) continue;
      var p = easeOut(clamp01((t - r.t0) / (r.t1 - r.t0)));
      var sc = r.scale * gs;
      var rise = (260 * sc * SY + 90) * (1 - p);     /* p = 0 : tout sous le cadre */
      var x = side === 'gauche' ? x0 + r.dx * gs : x1 - r.dx * gs;
      var y = H - (H - r.y) * gs + rise;              /* la base reste sous le bord bas */
      var filt = r.depth === 0 ? ' filter="url(#bd_ombre)"' : '';
      var yBase = H - (H - r.y) * gs;
      var riseMax = 260 * sc * SY + 90;
      out += '<g class="bd_ros" data-t0="' + r.t0 + '" data-t1="' + r.t1 + '" data-x="' + f1(x) + '" data-y="' + f1(yBase) + '" data-rise="' + f1(riseMax) + '"' + filt + ' transform="translate(' + f1(x) + ',' + f1(y) + ') scale(' + SX + ',' + SY + ')">' +
        mound({ x: 0, y: 0, scale: sc }) +
        agavePaper({ x: 0, y: 0, scale: sc, seed: r.seed, leaves: r.leaves, palette: 'bleu' }) +
        '</g>';
    }
    return out;
  }

  function bordAgaves(o) {
    o = o || {};
    var t = clamp01(o.t === undefined ? 1 : o.t);
    var side = o.side || 'deux';
    var gs = o.scale || 1;
    /* x0, x1 : les deux bords du cadre visible (defaut 0 et 1600) ; en portrait le moteur passe
       le cadre reel pour que les rosettes restent accrochees aux bords de l'ecran */
    var x0 = o.x0 == null ? 0 : o.x0, x1 = o.x1 == null ? W : o.x1;
    var out = '<g class="bd_agaves">';
    if (side === 'gauche' || side === 'deux') out += oneSide(CLUSTER, 'gauche', t, gs, x0, x1, o.plan);
    if (side === 'droite' || side === 'deux') out += oneSide(CLUSTER_R, 'droite', t, gs, x0, x1, o.plan);
    return out + '</g>';
  }

  window.defsBords = defsBords;
  window.paperGrain = paperGrain;
  window.bordAgaves = bordAgaves;
  /* met a jour les rosettes deja construites : bordAgavesUpdate(rootElement, t, dy) sans reconstruire */
  window.bordAgavesUpdate = function(root, t, dy) {
    if (!root) return;
    var els = root.querySelectorAll('.bd_ros'); dy = dy || 0;
    for (var i = 0; i < els.length; i++) {
      var e = els[i], t0 = +e.getAttribute('data-t0'), t1 = +e.getAttribute('data-t1');
      var p = easeOut(clamp01((t - t0) / (t1 - t0)));
      var y = +e.getAttribute('data-y') + (+e.getAttribute('data-rise')) * (1 - p) + dy;
      e.setAttribute('transform', 'translate(' + e.getAttribute('data-x') + ',' + f1(y) + ') scale(' + SX + ',' + SY + ')');
    }
  };
})();

</script>
<script>
/* ---------- les deux mots decoupes ----------
   Toutes les legendes de la page vivent dans le HTML, en data-fr, data-es,
   data-en : c est site.js qui les ecrit, comme sur toutes les autres pages.
   Ces deux mots la sont la seule exception : ce sont les deux moities de
   mexcalli decoupees dans du papier A L INTERIEUR du dessin (window.ransom).
   La langue courante est lue sur <html lang>, que site.js tient a jour. */
const LEGENDES = {
  fr:{ l1:"agave", l2:"cuit au four" },
  es:{ l1:"agave", l2:"cocido en horno" },
  en:{ l1:"agave", l2:"cooked in the oven" }
};
function langueDuDocument(){
  const l = document.documentElement.getAttribute('lang') || 'fr';
  return LEGENDES[l] ? l : 'fr';
}
let LANG = langueDuDocument();
if(window.MutationObserver){
  new MutationObserver(function(){
    const l = langueDuDocument();
    if(l === LANG) return;
    LANG = l; cache.delete('L_lettres'); render(P, true);
  }).observe(document.documentElement, { attributes:true, attributeFilter:['lang'] });
}

/* ---------- utilitaires ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);            /* 0..1 dans [a,b] */
const easeOut=t=>1-Math.pow(1-t,3);
const stepped=(t,n)=>Math.round(t*n)/n;               /* quantifie t en n paliers */
const g=id=>document.getElementById(id);
const REDUIT = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const cache=new Map();
function safe(fn,...a){ try{ return fn?fn(...a):''; }catch(e){ console.error(fn&&fn.name,e); return ''; } }

/* put : construit le contenu d une couche pour une clef d etat donnee. Meme clef, rien a faire :
   c est ce qui evite tout redessin entre deux etats. Une couche vide est cachee. */
function put(id,key,html){
  if(cache.get(id)===key) return;
  cache.set(id,key);
  /* html peut etre une fonction : le dessin n est alors calcule que si la clef a change,
     jamais a chaque image (c est le gros du cout JS par image sinon) */
  if(typeof html==='function') html=html();
  const e=g(id); e.innerHTML=html;
  e.classList.toggle('vide', !html);
  e.classList.toggle('vive', !!html);
}
/* move : deplace une couche entiere par transform et opacity CSS. dx, dy en unites de la scene,
   convertis en px avec le facteur K du cadrage courant ; sc = echelle autour du point (ox, oy)
   en unites de la scene. On n ecrit dans le style que si la valeur a change. */
function move(id,dx,dy,sc,op,ox,oy){
  const e=g(id); sc=(sc==null?1:sc);
  const tr='translate3d('+((dx||0)*K).toFixed(1)+'px,'+((dy||0)*K).toFixed(1)+'px,0) scale('+sc.toFixed(4)+')';
  if(e._tr!==tr){ e._tr=tr; e.style.transform=tr; }
  if(ox!=null){ const or=(((ox-VB.x)*K+OFFX).toFixed(1))+'px '+(((oy-VB.y)*K+OFFY).toFixed(1))+'px';
    if(e._or!==or){ e._or=or; e.style.transformOrigin=or; } }
  const o=clamp(op==null?1:op,0,1).toFixed(3);
  if(e._op!==o){ e._op=o; e.style.opacity=o; }
}
function cap(id,on){ const e=g(id); if(e) e.classList.toggle('on',!!on); }

/* ---------- defs ---------- */
(function initDefs(){
  const d=[];
  for(const f of ['defsAgave','defsFoudre','defsLettres','defsFlammes','defsBouteille','defsMedaillon','defsMains','defsBords']) if(typeof window[f]==='function') d.push(window[f]());
  /* le quadrillage du fond, plus discret que celui de bords.js (bd_grid) depuis que le papier
     est plus clair : maille 40, trait #8f8f56 a 0.16 */
  d.push('<pattern id="hs_grille" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40,0.5 L0,0.5 M0.5,0 L0.5,40" fill="none" stroke="#8f8f56" stroke-opacity="0.16" stroke-width="1"/></pattern>');
  g('defs').innerHTML=d.join('');
})();

/* ---------- le cadrage ----------
   Paysage : la scene 1600 x 900, coupee (slice) comme avant.
   Portrait (telephone) : on cadre une bande verticale de 700 unites de large, centree sur
   x = 800, dont le bas est a y = 1000 ; la hauteur suit l ecran. La ligne d horizon, les
   agaves, le sol restent donc en bas, les legendes en haut, et rien ne deborde. Les positions
   et echelles de chaque element sont donnees par MISE (voir plus bas). */
const COUCHES=['L_fond','L_collines','L_bords_fond','L_bords_devant','L_sol','L_agaves','L_flammes','L_lettres','L_soleil','L_main_h','L_main_b','L_bouteille','L_foudre','L_verre'];
let VB={x:0,y:0,w:1600,h:900}, K=1, OFFX=0, OFFY=0, VW=1600, VH=900, PORTRAIT=false;
let SCROLL_TOP=0, SCROLL_H=1;
let MISE=null;

function miseEnPage(portrait){
  if(!portrait) return {
    bords:{scale:1, x0:0, x1:1600},
    ransom:{x:800,y:470,scale:1},
    flammes:{x:0,y:900,width:1600},
    soleil:{x:1080,y:250,scale:1},
    cotes:[{x:330,y:790,scale:1.15,seed:11,leaves:12},{x:1270,y:790,scale:1.05,seed:5,leaves:12}],
    centre:{x:800,y:780,scale:1.35,seed:2,leaves:14},
    foudre:{scale:1.4}, verre:{scale:1.7}, flaques:{scale:1.9}, sol:{scale:1.35},
    mains:{x:800,y:470,scale:1}, bouteille:{x:800,y:470,scale:0.9}, descente:330, pousse:0.22
  };
  return {
    bords:{scale:0.55, x0:VB.x, x1:VB.x+VB.w},
    ransom:{x:800,y:390,scale:0.78},
    flammes:{x:0,y:900,width:1600},
    soleil:{x:800,y:210,scale:0.9},
    cotes:[{x:540,y:800,scale:0.85,seed:11,leaves:12},{x:1070,y:800,scale:0.8,seed:5,leaves:12}],
    centre:{x:800,y:780,scale:1.15,seed:2,leaves:14},
    foudre:{scale:1.2}, verre:{scale:1.45}, flaques:{scale:1.6}, sol:{scale:1.35},
    mains:{x:800,y:440,scale:0.78}, bouteille:{x:800,y:440,scale:0.78}, descente:250, pousse:0.15
  };
}

function cadrer(){
  const st=g('stage'), sc=g('scroller');
  VW=st.clientWidth||window.innerWidth; VH=st.clientHeight||window.innerHeight;
  const portrait = VW < VH;
  const largeurChange = (VW!==cadrer.vw), bascule = (portrait!==PORTRAIT);
  cadrer.vw=VW; PORTRAIT=portrait;
  if(PORTRAIT){ const w=700, h=Math.round(w*VH/VW); VB={x:800-w/2, y:1000-h, w:w, h:h}; }
  else VB={x:0,y:0,w:1600,h:900};
  K=Math.max(VW/VB.w, VH/VB.h); OFFX=(VW-VB.w*K)/2; OFFY=(VH-VB.h*K)/2;
  const vb=VB.x+' '+VB.y+' '+VB.w+' '+VB.h;
  for(const id of COUCHES){ const e=g(id); if(e.getAttribute('viewBox')!==vb) e.setAttribute('viewBox',vb); }
  SCROLL_TOP=sc.offsetTop; SCROLL_H=Math.max(1, sc.offsetHeight-VH);
  MISE=miseEnPage(PORTRAIT);
  /* le fond et les bords dependent du cadre ; les autres dessins non. On ne vide donc le
     cache que si la largeur ou l orientation change (la barre d un telephone qui se replie
     ne change que la hauteur : rien a reconstruire). */
  if(largeurChange||bascule){ cache.clear(); }
  else { cache.delete('L_fond'); }
  /* les origines de transformation en px dependent du cadre : on force leur reecriture */
  for(const id of COUCHES){ const e=g(id); e._or=null; e._tr=null; }
  render(P,true);
}

/* le fond : le papier, son quadrillage et son grain, sur toute la surface visible */
function fond(){
  const m=80, x=VB.x-m, y=VB.y-m, w=VB.w+2*m, h=VB.h+2*m;
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" style="fill:var(--historia-fond)"/>'+
    '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="url(#hs_grille)"/>'+
    (REDUIT?'':'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" filter="url(#bd_grain)"/>');
}

/* ---------- la ligne du temps (p de 0 a 1) ----------
 S0 0.00-0.13  titre, les grands agaves montent des bords (deux plans)
 S1 0.13-0.28  le mot : mexcalli -> metl + ixcalli, les flammes montent
 S2 0.28-0.37  collines, soleil, verre leve
 S3 0.37-0.64  trois agaves, l eclair en trois temps, violet, brun, le verre, les flaques, le sol
 S4 0.64-0.86  les mains, le meme eclair, la bouteille
 S5 0.86-1.00  la maison
 Principe : chaque couche est construite une fois par etat discret (put), puis deplacee en
 continu (move) ; les transitions sont des mouvements de papier, pas des coupes.
------------------------------------------------------ */
let P=0;
function render(p,force){
  P=p; const M=MISE; if(!M) return;
  const s3=seg(p,0.37,0.64), s4=seg(p,0.64,0.86);

  put('L_fond','fond'+VB.x+'x'+VB.y+'x'+VB.w+'x'+VB.h, ()=>fond());

  /* ---- S0 : les grands agaves des bords. Montent 0..0.11 en deux plans, restent pendant le
     mot, glissent sous le cadre 0.235..0.30 ---- */
  {
    const on = p<0.32;
    if(on){
      put('L_bords_fond','bf'+M.bords.scale, ()=>safe(window.bordAgaves,{t:1,side:'deux',scale:M.bords.scale,x0:M.bords.x0,x1:M.bords.x1,plan:'fond'}));
      put('L_bords_devant','bd'+M.bords.scale, ()=>safe(window.bordAgaves,{t:1,side:'deux',scale:M.bords.scale,x0:M.bords.x0,x1:M.bords.x1,plan:'devant'}));
      const upF=easeOut(seg(p,0,0.085)), upD=easeOut(seg(p,0.03,0.115));
      const down=easeOut(seg(p,0.235,0.30));
      const derive = p>=0.13 ? seg(p,0.13,0.2)*40 : 0;
      /* dy0 : de combien descendre la couche pour que la plus haute rosette (sommet vers
         y = 1040 - 820 x echelle) passe entierement sous le bord bas du cadre */
      const dy0=(VB.y+VB.h)-(1040-820*M.bords.scale)+30;
      move('L_bords_fond',0,(1-upF)*dy0 + down*dy0 + derive*0.6,1,1);
      move('L_bords_devant',0,(1-upD)*dy0 + down*dy0 + derive,1,1);
    } else { put('L_bords_fond','',''); put('L_bords_devant','',''); }
  }
  cap('c0', p<0.115);

  /* ---- S1 : le mot ---- */
  cap('c1', p>=0.135 && p<0.20); cap('c1b', p>=0.215 && p<0.275);
  {
    const on = p>=0.12 && p<0.31;
    if(on){
      const rt=seg(p,0.145,0.235); const q=stepped(rt,24);
      put('L_lettres','l'+q+LANG+M.ransom.scale, ()=>safe(window.ransom,{x:M.ransom.x,y:M.ransom.y,scale:M.ransom.scale,t:q,legend1:LEGENDES[LANG].l1,legend2:LEGENDES[LANG].l2}));
      const inn=easeOut(seg(p,0.12,0.16)), out=easeOut(seg(p,0.265,0.30));
      move('L_lettres',0,(1-inn)*60 - out*140,1,inn*(1-out));
      const ft=easeOut(seg(p,0.16,0.26));
      put('L_flammes','f1', ()=>safe(window.flames,{x:M.flammes.x,y:M.flammes.y,width:M.flammes.width,t:1}));
      move('L_flammes',0,(1-ft)*330 + out*380,1,1-out);
    } else { put('L_lettres','',''); put('L_flammes','',''); }
  }

  /* ---- collines : entrent en S2 en montant, restent jusqu a la fin ---- */
  {
    const hin=easeOut(seg(p,0.27,0.35));
    put('L_collines', hin>0?'h':'', ()=>hin>0 ? safe(window.hills,{t:1,far:'#9a9b62'}) : '');
    move('L_collines',0,(1-hin)*260,1,1);
  }

  /* ---- S2 : le soleil et le verre leve ---- */
  cap('c2', p>=0.29 && p<0.365);
  {
    const on=p>=0.275 && p<0.40;
    if(on){
      const st=easeOut(seg(p,0.285,0.345)); const out=easeOut(seg(p,0.36,0.395));
      const vt=stepped(seg(p,0.30,0.35),12);
      put('L_soleil','sun'+vt+M.soleil.scale, ()=>safe(window.sunGlass,{x:M.soleil.x,y:M.soleil.y,scale:M.soleil.scale,t:vt}));
      move('L_soleil',0,(1-st)*80 - out*60,0.9+0.1*st,st*(1-out),M.soleil.x,M.soleil.y);
    } else put('L_soleil','','');
  }

  /* ---- S3 : la legende ---- */
  const bx=M.centre.x, by=M.centre.y-90;   /* by : la ligne de reference, l agave central est a by+90 */
  cap('c3a', p>=0.375 && p<0.43); cap('c3b', p>=0.435 && p<0.51); cap('c3c', p>=0.52 && p<0.60);
  {
    const on=p>=0.355 && p<0.68;
    if(on){
      const enter=easeOut(seg(p,0.36,0.415));
      const boltT = s3<0.20?0 : s3<0.24?0.33 : s3<0.28?0.66 : s3<0.36?1 : 0;
      const hit = s3>=0.28;
      /* l agave frappe clignote une fois ou deux entre violet et bleu (jamais si mouvement reduit) */
      const flick = (!REDUIT && hit && s3<0.40) ? (Math.sin(s3*400)>0.3?1:0) : 0;
      let pal='bleu', outline=0, flicker=0;
      if(hit && s3<0.46){ pal='violet'; outline=1; flicker=flick; } else if(hit){ pal='brun'; }
      const gt=seg(s3,0.46,0.62), pt=seg(s3,0.55,0.75), bt=seg(s3,0.78,1);
      const leave=easeOut(seg(p,0.64,0.68));
      const c0=M.cotes[0], c1=M.cotes[1], ce=M.centre;
      put('L_agaves',`s3${pal}${outline}${flicker}${PORTRAIT}`, ()=>
        `${safe(window.mound,{x:c0.x,y:c0.y,scale:c0.scale})}${safe(window.agavePaper,{x:c0.x,y:c0.y,scale:c0.scale,leaves:c0.leaves,seed:c0.seed,palette:'bleu',shadow:'leaf'})}
         ${safe(window.mound,{x:c1.x,y:c1.y,scale:c1.scale})}${safe(window.agavePaper,{x:c1.x,y:c1.y,scale:c1.scale,leaves:c1.leaves,seed:c1.seed,palette:'bleu',shadow:'leaf'})}
         ${safe(window.mound,{x:ce.x,y:ce.y,scale:ce.scale})}${safe(window.agavePaper,{x:ce.x,y:ce.y,scale:ce.scale,leaves:ce.leaves,seed:ce.seed,palette:pal,outline:outline,flicker:flicker,shadow:'leaf'})}`);
      move('L_agaves',0,(1-enter)*300 + leave*420,1,1-leave);
      if(p<0.64){ put('L_foudre','b'+boltT+M.foudre.scale, ()=>boltT>0?safe(window.bolt,{x:bx,y:by-30,scale:M.foudre.scale,t:boltT}):''); move('L_foudre',0,0,1,1); }
      /* le sol qui se souleve et les flaques : une couche sous les agaves */
      const bq=stepped(bt,16), pq=stepped(pt,16);
      put('L_sol','sol'+bq+pq+PORTRAIT, ()=>(bt>0||pt>0) ?
        (pt>0?safe(window.puddles,{x:bx,y:by+96,scale:M.flaques.scale,t:pq}):'') +
        (bt>0?safe(window.groundBump,{x:bx,y:by+90,scale:M.sol.scale,t:bq}):'') : '');
      move('L_sol',0,leave*420,1,1-leave);
      const gq=stepped(gt,24);
      put('L_verre','gl'+gq+PORTRAIT, ()=>gt>0?safe(window.glass,{x:bx,y:by+86,scale:M.verre.scale,fill:Math.min(1,gq*1.3),rise:easeOut(gq)}):'');
      move('L_verre',0,leave*420,1,1-leave);
    } else { for(const id of ['L_agaves','L_sol','L_verre']) put(id,'',''); if(p<0.355) put('L_foudre','',''); }
  }

  /* ---- S4 : le meme eclair sur deux personnes ---- */
  cap('c4a', p>=0.655 && p<0.72); cap('c4b', p>=0.725 && p<0.77); cap('c4c', p>=0.775 && p<0.85);
  {
    const on=p>=0.64;
    if(on){
      const mn=M.mains, bo=M.bouteille;
      const ht=easeOut(seg(p,0.645,0.715));               /* les mains entrent */
      const bt2 = p<0.725?0 : p<0.735?0.33 : p<0.745?0.66 : p<0.765?1 : 0;
      const bot=seg(p,0.765,0.83);                          /* la bouteille apparait entre les mains */
      const r=easeOut(seg(p,0.86,0.94));                    /* S5 : les mains s ouvrent et sortent, la bouteille descend */
      const doigts=stepped(Math.max(ht,bot),6);            /* les doigts se referment par paliers, la main bouge en CSS */
      put('L_main_h','mh'+doigts+mn.scale, ()=>safe(window.hands,{x:mn.x,y:mn.y,scale:mn.scale,t:doigts,part:'haut',fixe:true}));
      put('L_main_b','mb'+doigts+mn.scale, ()=>safe(window.hands,{x:mn.x,y:mn.y,scale:mn.scale,t:doigts,part:'bas',fixe:true}));
      const portee=60*mn.scale+30, e=1-Math.pow(1-ht,2.5);
      const dHaut=-((mn.y-VB.y)+portee)*(1-e), dBas=((VB.y+VB.h-mn.y)+portee)*(1-e);
      move('L_main_h',0,dHaut - r*((mn.y-VB.y)+portee),1+r*0.2,1-r,mn.x,mn.y);
      move('L_main_b',0,dBas + r*((VB.y+VB.h-mn.y)+portee),1+r*0.2,1-r,mn.x,mn.y);
      put('L_foudre','b4'+bt2+M.foudre.scale, ()=>bt2>0?safe(window.bolt,{x:mn.x,y:mn.y,scale:M.foudre.scale,t:bt2}):'');
      if(p>=0.68) move('L_foudre',0,0,1,1);
      put('L_bouteille','bo'+bo.scale, ()=>safe(window.pinaBottle,{x:bo.x,y:bo.y,scale:bo.scale,t:1}));
      const eb=easeOut(bot);
      move('L_bouteille',0,(1-eb)*40 + r*M.descente, (0.8+0.2*eb)*(1+M.pousse*r), eb, bo.x, bo.y);
    } else { put('L_main_h','',''); put('L_main_b','',''); put('L_bouteille','',''); }
  }
  /* S5 : le nom, tenu jusqu au bout */
  cap('c5', p>=0.895);
  g('hint').classList.toggle('off', p>0.03);
}

/* ---------- moteur de defilement ----------
   Une seule lecture de scrollY par image, aucune mesure de mise en page dans la boucle :
   la position et la hauteur du defilement sont mesurees dans cadrer(), au chargement et au
   redimensionnement. */
let ticking=false;
function progress(){ return clamp((window.scrollY-SCROLL_TOP)/SCROLL_H,0,1); }
function onScroll(){ if(ticking) return; ticking=true; requestAnimationFrame(()=>{ ticking=false; render(progress()); }); }
window.addEventListener('scroll',onScroll,{passive:true});
let resizeTimer=0;
window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(cadrer,120); });
window.addEventListener('orientationchange',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(cadrer,200); });
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(cadrer,120); });
window.__setProgress=function(x){ window.scrollTo(0,SCROLL_TOP+SCROLL_H*x); render(x,true); };
/* mesure : cout JS de render sur n pas (les images reelles se mesurent avec le traceur) */
window.__perf=function(n){ n=n||200; const ts=[]; for(let i=0;i<=n;i++){ const t0=performance.now(); render(i/n,true); ts.push(performance.now()-t0);} ts.sort((a,b)=>a-b); return {avg:+(ts.reduce((a,b)=>a+b,0)/ts.length).toFixed(2), p95:+ts[Math.floor(ts.length*0.95)].toFixed(2), max:+ts[ts.length-1].toFixed(2)}; };
/* Le chrome de la maison est pose juste apres ce script : il ajoute l entete fixe, le pied,
   la porte d age et il ecrit la langue. Le pied change la hauteur du document mais pas celle
   du scroller ; la langue, elle, arrive apres. On relit tout une fois qu il a fini. */
window.__historiaRelire = function(){ LANG = langueDuDocument(); cache.delete('L_lettres'); cadrer(); };
cadrer();
window.addEventListener('load', cadrer);
</script>

<script>
siteChrome.init();
window.__historiaRelire();
</script>
