<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ============================================================================
     LE PASSAGE EN CAISSE, premiere marche : l identification.
     Forme relevee sur gentlemonster.com le 16 aout 2026 : une colonne etroite,
     une phrase qui explique, la mention des champs obligatoires alignee a
     droite, un champ blanc a angles arrondis, un bouton plein inactif tant que
     le champ est vide, un "ou", les deux fournisseurs, puis le suivi de commande
     detache en bas.

     LA DONNEE. Raouf veut les donnees des clients. Cette page est l endroit ou
     elles entrent : l adresse est demandee AVANT le paiement, exactement pour
     cela, et la case d inscription est cochable, jamais cochee d avance.
     Ce que le site collecte doit etre annonce ici et repris dans
     confidentialite-et-cookies.html. Rien n est envoyé nulle part tant que la
     route technique n est pas tranchee : statique plus Stripe, ou plateforme.
     ========================================================================= -->

<body data-page=""
      data-titre-fr="Commande. Ivresse d'Amour, Toloache Legitimo"
      data-titre-es="Pedido. Ivresse d'Amour, Toloache Legitimo"
      data-titre-en="Checkout. Ivresse d'Amour, Toloache Legitimo">

<main class="page caisse">

  <section class="caisse__col">

    <p class="kicker" data-fr="Commande" data-es="Pedido" data-en="Checkout"></p>
    <h1 class="caisse__titre" data-fr="Commande" data-es="Pedido" data-en="Checkout"></h1>

    <p class="caisse__intro"
       data-fr="Vos coordonnées, puis l'adresse où la bouteille doit arriver. Le paiement vient ensuite."
       data-es="Sus datos, luego la dirección donde debe llegar la botella. El pago viene después."
       data-en="Your details, then the address where the bottle should arrive. Payment comes next."></p>

    <p class="caisse__oblig" data-fr="* Champs obligatoires" data-es="* Campos obligatorios" data-en="* Required fields"></p>

    <!-- 22 oct 2026, Raouf : "when they buy, not the cart, buy directly, with the person's details and the address where it goes". -->
    <form class="caisse__f" id="f-commande" novalidate>
      <p class="kicker" data-fr="Vous" data-es="Usted" data-en="You"></p>
      <div class="caisse__rang">
      <label class="caisse__l" for="prenom"><span class="sr" data-fr="Prénom" data-es="Nombre" data-en="First name"></span>
        <input id="prenom" name="prenom" type="text" autocomplete="given-name" required data-fr-placeholder="Prénom *" data-es-placeholder="Nombre *" data-en-placeholder="First name *"></label>
      <label class="caisse__l" for="nom"><span class="sr" data-fr="Nom" data-es="Apellido" data-en="Last name"></span>
        <input id="nom" name="nom" type="text" autocomplete="family-name" required data-fr-placeholder="Nom *" data-es-placeholder="Apellido *" data-en-placeholder="Last name *"></label>
      </div>
      <label class="caisse__l" for="courriel"><span class="sr" data-fr="Adresse électronique" data-es="Correo electrónico" data-en="Email address"></span>
        <input id="courriel" name="courriel" type="email" autocomplete="email" required data-fr-placeholder="Adresse électronique *" data-es-placeholder="Correo electrónico *" data-en-placeholder="Email address *"></label>
      <label class="caisse__l" for="telephone"><span class="sr" data-fr="Téléphone" data-es="Teléfono" data-en="Phone"></span>
        <input id="telephone" name="telephone" type="tel" autocomplete="tel" required data-fr-placeholder="Téléphone *" data-es-placeholder="Teléfono *" data-en-placeholder="Phone *"></label>

      <p class="kicker caisse__kicker2" data-fr="Votre adresse" data-es="Su dirección" data-en="Your address"></p>
      <label class="caisse__l" for="adresse"><span class="sr" data-fr="Adresse" data-es="Dirección" data-en="Address"></span>
        <input id="adresse" name="adresse" type="text" autocomplete="address-line1" required data-fr-placeholder="Adresse *" data-es-placeholder="Dirección *" data-en-placeholder="Address *"></label>
      <label class="caisse__l" for="complement"><span class="sr" data-fr="Complément (bâtiment, étage)" data-es="Complemento (edificio, piso)" data-en="Address line 2"></span>
        <input id="complement" name="complement" type="text" autocomplete="address-line2" data-fr-placeholder="Complément (bâtiment, étage)" data-es-placeholder="Complemento (edificio, piso)" data-en-placeholder="Address line 2"></label>
      <div class="caisse__rang">
      <label class="caisse__l" for="cp"><span class="sr" data-fr="Code postal" data-es="Código postal" data-en="Postcode"></span>
        <input id="cp" name="cp" type="text" autocomplete="postal-code" required data-fr-placeholder="Code postal *" data-es-placeholder="Código postal *" data-en-placeholder="Postcode *"></label>
      <label class="caisse__l" for="ville"><span class="sr" data-fr="Ville" data-es="Ciudad" data-en="City"></span>
        <input id="ville" name="ville" type="text" autocomplete="address-level2" required data-fr-placeholder="Ville *" data-es-placeholder="Ciudad *" data-en-placeholder="City *"></label>
      </div>
      <label class="caisse__l" for="pays"><span class="sr" data-fr="Pays" data-es="País" data-en="Country"></span>
        <input id="pays" name="pays" type="text" autocomplete="country-name" required value="France" data-fr-placeholder="Pays *" data-es-placeholder="País *" data-en-placeholder="Country *"></label>

      <label class="caisse__sur caisse__case" for="autre"><input id="autre" name="autre" type="checkbox">
        <span data-fr="Livrer à une autre adresse" data-es="Entregar en otra dirección" data-en="Deliver to a different address"></span></label>

      <div id="livraison" hidden>
        <p class="kicker caisse__kicker2" data-fr="Adresse de livraison" data-es="Dirección de entrega" data-en="Delivery address"></p>
      <label class="caisse__l" for="l_nom"><span class="sr" data-fr="Nom du destinataire" data-es="Nombre del destinatario" data-en="Recipient name"></span>
        <input id="l_nom" name="l_nom" type="text" autocomplete="shipping name" data-fr-placeholder="Nom du destinataire" data-es-placeholder="Nombre del destinatario" data-en-placeholder="Recipient name"></label>
      <label class="caisse__l" for="l_adresse"><span class="sr" data-fr="Adresse" data-es="Dirección" data-en="Address"></span>
        <input id="l_adresse" name="l_adresse" type="text" autocomplete="shipping address-line1" data-fr-placeholder="Adresse" data-es-placeholder="Dirección" data-en-placeholder="Address"></label>
      <label class="caisse__l" for="l_complement"><span class="sr" data-fr="Complément" data-es="Complemento" data-en="Address line 2"></span>
        <input id="l_complement" name="l_complement" type="text" autocomplete="shipping address-line2" data-fr-placeholder="Complément" data-es-placeholder="Complemento" data-en-placeholder="Address line 2"></label>
        <div class="caisse__rang">
      <label class="caisse__l" for="l_cp"><span class="sr" data-fr="Code postal" data-es="Código postal" data-en="Postcode"></span>
        <input id="l_cp" name="l_cp" type="text" autocomplete="shipping postal-code" data-fr-placeholder="Code postal" data-es-placeholder="Código postal" data-en-placeholder="Postcode"></label>
      <label class="caisse__l" for="l_ville"><span class="sr" data-fr="Ville" data-es="Ciudad" data-en="City"></span>
        <input id="l_ville" name="l_ville" type="text" autocomplete="shipping address-level2" data-fr-placeholder="Ville" data-es-placeholder="Ciudad" data-en-placeholder="City"></label>
        </div>
      <label class="caisse__l" for="l_pays"><span class="sr" data-fr="Pays" data-es="País" data-en="Country"></span>
        <input id="l_pays" name="l_pays" type="text" autocomplete="shipping country-name" data-fr-placeholder="Pays" data-es-placeholder="País" data-en-placeholder="Country"></label>
      </div>

      <p class="caisse__erreur" id="erreur" hidden data-fr="Merci de remplir les champs marqués d'une étoile." data-es="Por favor complete los campos marcados con asterisco." data-en="Please fill in the fields marked with a star."></p>
      <button class="b-plein" id="continuer" type="submit" data-fr="Continuer vers le paiement" data-es="Continuar al pago" data-en="Continue to payment"></button>
    </form>

    <a class="b-vide b-ligne caisse__suivi" href="contact.html"
       data-fr="Suivre ma commande" data-es="Seguir mi pedido" data-en="Track my order"></a>

    <p class="mention caisse__note"
       data-fr="Vente réservée aux personnes majeures. Votre adresse sert uniquement au suivi de la commande et à l'envoi de la facture."
       data-es="Venta reservada a mayores de edad. Su correo sirve únicamente para el seguimiento del pedido y el envío de la factura."
       data-en="Sale restricted to adults of legal drinking age. Your address is used only to track the order and send the invoice."></p>

    <!-- route technique non tranchee : statique plus Stripe, ou plateforme -->
    <p class="mention caisse__note"
       data-fr="Paiement par carte. La confirmation envoyée par courriel précise le lot de chaque bouteille."
       data-es="Pago con tarjeta. La confirmación enviada por correo precisa el lote de cada botella."
       data-en="Card payment. The confirmation sent by email specifies the batch of each bottle."></p>

  </section>

</main>

<script>siteChrome.init();</script>
<script>
/* 22 oct 2026 : la commande (coordonnees + adresse de livraison) est gardee dans le navigateur (ida.commande)
   et reprise par la page de paiement. Rien n est envoye nulle part tant que la route technique n est pas tranchee. */
(function(){
  var f = document.getElementById('f-commande'), autre = document.getElementById('autre'), liv = document.getElementById('livraison'), err = document.getElementById('erreur');
  if(!f) return;
  var CLE = 'ida.commande';
  try{ var m = JSON.parse(localStorage.getItem(CLE) || '{}'); Object.keys(m).forEach(function(k){ var el = f.elements[k]; if(!el) return; if(el.type === 'checkbox') el.checked = !!m[k]; else el.value = m[k]; }); }catch(e){}
  function majLiv(){ liv.hidden = !autre.checked; }
  autre.addEventListener('change', majLiv); majLiv();
  function valide(){
    var ok = true; var req = ['prenom','nom','courriel','telephone','adresse','cp','ville','pays']; if(autre.checked) req = req.concat(['l_adresse','l_cp','l_ville','l_pays']);
    req.forEach(function(k){ var el = f.elements[k]; var v = (el.value || '').trim(); var bon = k === 'courriel' ? /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) : v.length > 0; el.classList.toggle('est-vide', !bon); if(!bon) ok = false; });
    return ok;
  }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if(!valide()){ err.hidden = false; var premier = f.querySelector('.est-vide'); if(premier) premier.focus(); return; }
    err.hidden = true;
    var d = {}; Array.prototype.forEach.call(f.elements, function(el){ if(!el.name) return; d[el.name] = el.type === 'checkbox' ? el.checked : el.value.trim(); });
    try{ localStorage.setItem(CLE, JSON.stringify(d)); localStorage.setItem('ida.courriel', d.courriel); }catch(e2){}
    window.location.href = 'paiement.html';
  });
})();
</script>
</body>
</html>
